{id:"k101",f:"kiso",t:"危機理論",q:"フィンクの危機モデルで最初の段階はどれか。",c:["衝撃","防御的退行","承認","適応"],a:0,e:"フィンクの危機モデルは衝撃→防御的退行→承認→適応の4段階。段階に応じて安全の確保や支持的な関わりを行う。"},
{id:"k102",f:"kiso",t:"看護理論",q:"看護師と患者の関係が方向づけ・同一化・開拓利用・問題解決の段階で発展するとしたのは誰か。",c:["ペプロウ","オレム","ヘンダーソン","ロイ"],a:0,e:"ペプロウは『人間関係の看護論』で看護を対人関係のプロセスとしてとらえた。"},
{id:"k103",f:"kiso",t:"看護理論",q:"看護を「患者の生命力の消耗を最小にするように生活過程を整えること」と考えたのは誰か。",c:["ナイチンゲール","ヘンダーソン","ペプロウ","ワトソン"],a:0,e:"ナイチンゲールは『看護覚え書』で、換気・陽光・清潔・静けさ・食事などの環境を整えることの大切さを示した。"},
{id:"k104",f:"kiso",t:"看護過程",q:"看護目標の表現で最も適切なのはどれか。",c:["患者にインスリン注射の指導をする","3日後までに、患者が自分でインスリンを正しく注射できる","インスリンについての理解を深める","看護師が毎日注射を確認する"],a:1,e:"目標（期待される成果）は患者を主語にし、いつまでに何ができるかを観察・測定できる言葉で書く。"},
{id:"k105",f:"kiso",t:"フィジカルアセスメント",q:"腹部のフィジカルアセスメントの順序で正しいのはどれか。",c:["視診→聴診→打診→触診","視診→触診→打診→聴診","触診→視診→聴診→打診","打診→触診→視診→聴診"],a:0,e:"触診や打診で腸が刺激されると腸蠕動音が変わるため、腹部は視診の次に聴診を行う。"},
{id:"k106",f:"kiso",t:"フィジカルアセスメント",q:"腸蠕動音が消失していると判断するまでに聴診を続ける時間はどれか。",c:["10秒間","30秒間","1分間","5分間"],a:3,e:"腸蠕動音は通常5〜15秒に1回程度聞こえる。5分間聴取しても聞こえない場合に消失と判断する。"},
{id:"k107",f:"kiso",t:"バイタルサイン",q:"血圧測定で、マンシェットのゴム嚢の幅が上腕に対して狭すぎるとどうなるか。",c:["血圧が高く測定される","血圧が低く測定される","測定値は変わらない","脈拍が速く測定される"],a:0,e:"幅が狭いと動脈を圧迫するのに強い圧が必要になり、高く測定される。広すぎると低く出る。巻き方がゆるい場合も高く出る。"},
{id:"k108",f:"kiso",t:"バイタルサイン",q:"橈骨動脈で脈拍を測定するときに用いない指はどれか。",c:["示指","中指","環指","母指"],a:3,e:"母指には比較的太い動脈があり、自分の脈と混同しやすいため用いない。示指・中指・環指の3本を当てる。"},
{id:"k109",f:"kiso",t:"体位",q:"セミファウラー位の上半身の挙上角度はどれか。",c:["0度","15〜30度","45度","90度"],a:1,e:"セミファウラー位は15〜30度、ファウラー位は45度前後、座位は90度。"},
{id:"k110",f:"kiso",t:"褥瘡予防",q:"褥瘡予防のための体位変換の間隔として、基本とされるのはどれか。",c:["30分ごと","2時間ごと","6時間ごと","12時間ごと"],a:1,e:"基本は2時間ごと。体圧分散寝具を使う場合は4時間以内を目安にできる。皮膚の状態を見ながら個別に調整する。"},
{id:"k111",f:"kiso",t:"栄養",q:"脂質1gあたりのエネルギー量はどれか。",c:["4 kcal","7 kcal","9 kcal","12 kcal"],a:2,e:"脂質は9 kcal/g、炭水化物とたんぱく質は4 kcal/g、アルコールは約7 kcal/g。"},
{id:"k112",f:"kiso",t:"栄養",q:"日本肥満学会の判定基準で普通体重とされるBMIはどれか。",c:["16.0以上18.5未満","18.5以上25.0未満","25.0以上30.0未満","30.0以上35.0未満"],a:1,e:"BMI 18.5未満が低体重、18.5以上25.0未満が普通体重、25.0以上が肥満。BMI＝体重(kg)÷身長(m)²。"},
{id:"k113",f:"kiso",t:"経管栄養",q:"経管栄養で下痢を防ぐための援助で適切なのはどれか。",c:["指示された速度より速く注入する","冷蔵庫から出してすぐに注入する","注入速度を守り、栄養剤を常温にする","作り置きした栄養剤を翌日に使う"],a:2,e:"速すぎる注入、冷たい栄養剤、細菌汚染は下痢の原因になる。開封後は時間内に使い切る。"},
{id:"k114",f:"kiso",t:"排泄援助",q:"成人男性の膀胱留置カテーテルを固定する部位で適切なのはどれか。",c:["大腿内側","下腹部","臀部","膝"],a:1,e:"男性は陰茎を上向きにして下腹部に固定し、陰茎陰嚢角の圧迫による潰瘍を防ぐ。女性は大腿内側に固定する。"},
{id:"k115",f:"kiso",t:"排泄援助",q:"膀胱留置カテーテルの蓄尿バッグの管理で適切なのはどれか。",c:["膀胱より高い位置に置く","膀胱より低い位置に置き、床につけない","バッグを床に直接置く","チューブを屈曲させておく"],a:1,e:"尿の逆流を防ぐため膀胱より低く、細菌汚染を防ぐため床につけない。チューブの屈曲や閉塞がないよう確認する。"},
{id:"k116",f:"kiso",t:"排泄援助",q:"成人にグリセリン浣腸を行うとき、チューブを肛門から挿入する長さの目安はどれか。",c:["1〜2 cm","5 cm程度","10 cm程度","15 cm程度"],a:1,e:"成人では5cm程度挿入する。深く入れすぎると直腸壁を傷つけるおそれがある。"},
{id:"k117",f:"kiso",t:"清潔ケア",q:"女性の陰部洗浄で拭く方向として適切なのはどれか。",c:["肛門側から恥骨側へ","恥骨側から肛門側へ","左右に往復させる","方向は問わない"],a:1,e:"尿道口や腟口への便の汚染を防ぐため、前（恥骨側）から後ろ（肛門側）へ拭く。"},
{id:"k118",f:"kiso",t:"清潔ケア",q:"義歯の取り扱いで適切なのはどれか。",c:["装着したまま歯ブラシでこする","外して流水下でブラシで洗い、水につけて保管する","熱湯で消毒する","乾燥させてティッシュに包んで保管する"],a:1,e:"義歯は外して流水下で洗い、乾燥による変形を防ぐため水や洗浄剤に浸けて保管する。熱湯は変形の原因になる。"},
{id:"k119",f:"kiso",t:"更衣",q:"片麻痺のある患者の寝衣交換の方法で正しいのはどれか。",c:["患側から脱ぎ、健側から着る","健側から脱ぎ、患側から着る","両側同時に脱ぐ","脱ぐのも着るのも健側から"],a:1,e:"「脱健着患」。健側から脱ぐと患側の関節に無理がかからず、着るときは動きにくい患側から通す。"},
{id:"k120",f:"kiso",t:"睡眠",q:"入眠を促す援助で適切なのはどれか。",c:["就寝直前にコーヒーを飲む","就寝前に足浴を行う","就寝直前に激しい運動をする","寝室を明るくしておく"],a:1,e:"足浴で末梢を温めると副交感神経が優位になりリラックスできる。カフェイン、就寝直前の激しい運動、明るい照明は入眠を妨げる。"},
{id:"k121",f:"kiso",t:"活動",q:"関節可動域訓練の実施方法で適切なのはどれか。",c:["痛みが出るまで強く動かす","痛みのない範囲でゆっくり動かす","関節を素早く反動をつけて動かす","1日に1回だけ行えばよい"],a:1,e:"関節の近くを支えながら、痛みのない範囲でゆっくり動かす。無理に動かすと関節や筋を傷める。"},
{id:"k122",f:"kiso",t:"無菌操作",q:"滅菌包を開くときの順序で正しいのはどれか。",c:["手前側から開く","最初に向こう側（遠い側）を開く","中央から破って開く","どこからでもよい"],a:1,e:"最初に向こう側を開き、次に左右、最後に手前を開く。滅菌物の上を手や腕が通過しないようにするため。"},
{id:"k123",f:"kiso",t:"感染予防",q:"接触予防策が必要なのはどれか。",c:["MRSA感染症","肺結核","インフルエンザ","麻疹"],a:0,e:"MRSA・ノロウイルス・疥癬・クロストリディオイデス・ディフィシルなどは接触予防策。結核・麻疹・水痘は空気予防策、インフルエンザは飛沫予防策。"},
{id:"k124",f:"kiso",t:"感染予防",q:"N95マスクを着用する必要があるのはどれか。",c:["肺結核の患者の病室に入るとき","便の処理をするとき","採血をするとき","手術室で器械を準備するとき"],a:0,e:"空気感染する結核・麻疹・水痘の患者の病室に入るときはN95マスクを着用する。患者が部屋の外に出るときはサージカルマスクを着けてもらう。"},
{id:"k125",f:"kiso",t:"感染予防",q:"使用済みの注射針の取り扱いで適切なのはどれか。",c:["キャップをかけ直してから捨てる","リキャップせず耐貫通性の専用容器に捨てる","一般ごみと一緒に捨てる","手で針を曲げてから捨てる"],a:1,e:"リキャップは針刺し事故の大きな原因。使用後はそのまま耐貫通性の廃棄容器に入れ、容器は8割程度で交換する。"},
{id:"k126",f:"kiso",t:"与薬の技術",q:"直腸内与薬（坐薬の挿入）のときに患者に促すことで適切なのはどれか。",c:["息を止めてもらう","口で呼吸してもらう","腹圧をかけてもらう","立位をとってもらう"],a:1,e:"口呼吸をすると腹圧が抜けて肛門括約筋がゆるみ、挿入しやすい。左側臥位で膝を曲げてもらい、内肛門括約筋を越える深さまで挿入する。"},
{id:"k127",f:"kiso",t:"与薬の技術",q:"点眼薬の滴下部位で適切なのはどれか。",c:["角膜の中央","下眼瞼結膜の中央","上眼瞼の皮膚","内眼角の皮膚"],a:1,e:"下眼瞼を軽く引き下げ、下眼瞼結膜の中央に滴下する。容器の先がまつげや眼に触れないようにし、点眼後は目頭を軽く押さえる。"},
{id:"k128",f:"kiso",t:"与薬の技術",q:"点滴静脈内注射中に血管外漏出を疑う所見はどれか。",c:["刺入部の腫脹と痛み","滴下速度の上昇","刺入部より末梢の皮膚の紅潮のみ","尿量の増加"],a:0,e:"刺入部の腫れ・痛み・冷感・滴下不良は血管外漏出のサイン。すぐに注入を止めて医師に報告する。抗がん剤の漏出は組織壊死を起こしうる。"},
{id:"k129",f:"kiso",t:"看護記録",q:"看護記録の記載内容を誤ったときの訂正方法で適切なのはどれか。",c:["修正液で消して書き直す","黒く塗りつぶして書き直す","二重線を引き、訂正した日時と訂正者がわかるようにする","そのページを破って書き直す"],a:2,e:"看護記録は法的な証拠にもなるため、元の記載が読めるよう二重線で訂正し、訂正日時と訂正者を残す。電子カルテでも修正履歴が残る。"},
{id:"k130",f:"kiso",t:"退院支援",q:"退院支援を開始する時期で最も適切なのはどれか。",c:["入院時","退院が決まった日","退院前日","退院後の外来受診時"],a:0,e:"退院後の生活を見すえ、入院時（入院前）から情報を集めて支援を始める。早期に多職種で計画を立てることが大切。"}
);

/* ===== 成人看護学（追加） ===== */
Q.push(
{id:"se101",f:"seijin",t:"周術期",q:"手術前に深呼吸や咳嗽の練習を行う目的はどれか。",c:["術後の肺合併症の予防","術後の出血の予防","術後せん妄の予防","縫合不全の予防"],a:0,e:"全身麻酔や創部痛で呼吸が浅くなり、痰がたまって無気肺や肺炎を起こしやすい。術前から深呼吸・咳嗽・排痰の方法を練習しておく。"},
{id:"se102",f:"seijin",t:"周術期",q:"術後の早期離床の主な目的はどれか。",c:["創部の安静","深部静脈血栓症の予防","体重の増加","尿量の減少"],a:1,e:"早期離床は深部静脈血栓症・肺合併症・腸蠕動の回復遅延・筋力低下の予防に役立つ。"},
{id:"se103",f:"seijin",t:"周術期",q:"硬膜外麻酔で起こりやすい合併症はどれか。",c:["血圧低下","高血糖","徐呼吸のない頻脈","多尿"],a:0,e:"局所麻酔薬で交感神経が遮断されると血管が広がり、血圧が下がる。下肢のしびれや運動麻痺、尿閉も観察する。"},
{id:"se104",f:"seijin",t:"周術期",q:"術後出血を疑う所見はどれか。",c:["ドレーンの排液が急に鮮血性になり量が増えた","排液が淡々血性から漿液性に変わった","血圧が上昇し脈拍が減少した","尿量が増えた"],a:0,e:"鮮血性の排液の急増、頻脈、血圧低下、顔色不良、冷汗は出血のサイン。すぐに医師に報告する。"},
{id:"se105",f:"seijin",t:"消化器",q:"日本人の大腸癌の好発部位はどれか。",c:["盲腸と上行結腸","横行結腸","S状結腸と直腸","虫垂"],a:2,e:"大腸癌はS状結腸と直腸に多い。便潜血検査で早期発見をめざし、陽性なら大腸内視鏡検査を行う。"},
{id:"se106",f:"seijin",t:"消化器",q:"胃全摘術後、数年たってから起こりやすいのはどれか。",c:["巨赤芽球性貧血","鉄過剰症","高カルシウム血症","多血症"],a:0,e:"胃の壁細胞から出る内因子がなくなるとビタミンB12が吸収できず、体内の貯蔵が尽きる数年後に巨赤芽球性貧血が起こる。ビタミンB12を注射で補う。"},
{id:"se107",f:"seijin",t:"消化器",q:"食道癌の術後に反回神経麻痺が起こったときにみられる症状はどれか。",c:["嗄声","吃逆","顔面の麻痺","下肢の脱力"],a:0,e:"反回神経は声帯を動かす神経。リンパ節郭清で傷つくと声がかすれ、誤嚥もしやすくなる。"},
{id:"se108",f:"seijin",t:"肝",q:"肝性脳症を予防するための生活指導で適切なのはどれか。",c:["高たんぱく食をとる","便秘を予防する","水分を極端に控える","睡眠薬を自由に使う"],a:1,e:"便秘になると腸内でアンモニアが多くつくられ吸収される。ラクツロースなどで排便を整え、たんぱく質は医師の指示量を守る。"},
{id:"se109",f:"seijin",t:"呼吸器",q:"日本の肺癌で最も多い組織型はどれか。",c:["腺癌","扁平上皮癌","小細胞癌","大細胞癌"],a:0,e:"肺癌は腺癌が最も多く、非喫煙者や女性にも多い。扁平上皮癌と小細胞癌は喫煙との関係が強い。"},
{id:"se110",f:"seijin",t:"呼吸器",q:"在宅酸素療法の適応の目安となる、安静時の動脈血酸素分圧〈PaO₂〉はどれか。",c:["90 Torr以下","75 Torr以下","55 Torr以下","30 Torr以下"],a:2,e:"PaO₂ 55 Torr以下、または60 Torr以下で睡眠時や運動時に著しい低酸素血症となる場合などが適応。"},
{id:"se111",f:"seijin",t:"呼吸器",q:"胸腔ドレナージ中、水封室の水位が呼吸に合わせて上下に動いている。この状態の判断で正しいのはどれか。",c:["ドレーンが閉塞している","ドレーンが開通している","すぐにドレーンを抜く必要がある","吸引圧が強すぎる"],a:1,e:"呼吸性移動はドレーンが胸腔とつながって開通しているサイン。移動がなくなったら閉塞や肺の再膨張を考える。"},
{id:"se112",f:"seijin",t:"呼吸器",q:"胸腔ドレナージ中、水封室に気泡が続けて出ている。考えられるのはどれか。",c:["エアリーク（空気漏れ）","ドレーンの閉塞","胸水の減少","正常な呼吸性移動"],a:0,e:"水封室の持続的な気泡は肺からの空気漏れか、接続部のゆるみなど回路からの漏れを示す。接続部を確認し医師に報告する。"},
{id:"se113",f:"seijin",t:"循環器",q:"心不全の患者に、毎日同じ条件で体重を測るよう指導する目的はどれか。",c:["栄養状態をみるため","体液の貯留を早く見つけるため","筋力をみるため","服薬の効果をみるため"],a:1,e:"短期間の体重増加（数日で2kg程度など）は水分の貯留を示し、心不全の悪化のサイン。起床後排尿後など同じ条件で測る。"},
{id:"se114",f:"seijin",t:"循環器",q:"急性心筋梗塞の胸痛の特徴はどれか。",c:["数秒で消える刺すような痛み","ニトログリセリンで速やかに消える","30分以上続き、ニトログリセリンが効きにくい","深呼吸で軽くなる"],a:2,e:"狭心症の痛みは数分〜15分程度でニトログリセリンが効くが、心筋梗塞は30分以上持続し効きにくい。冷汗や悪心を伴うことが多い。"},
{id:"se115",f:"seijin",t:"循環器",q:"大腿動脈から心臓カテーテル検査を受けた後、特に観察する項目はどれか。",c:["穿刺側の足背動脈の拍動","聴力","瞳孔の大きさ","握力"],a:0,e:"穿刺部の出血・血腫と、穿刺側下肢の血流障害（足背動脈の拍動、皮膚の色や温度、しびれ）を観察する。"},
{id:"se116",f:"seijin",t:"循環器",q:"閉塞性動脈硬化症でみられる症状はどれか。",c:["間欠性跛行","安静時振戦","起座呼吸","頸静脈怒張"],a:0,e:"下肢の動脈が狭くなり、歩くとふくらはぎが痛くなって休むと治まる（間欠性跛行）。進むと安静時痛や潰瘍が起こる。"},
{id:"se117",f:"seijin",t:"脳神経",q:"グラスゴー・コーマ・スケール〈GCS〉の評価項目はどれか。",c:["開眼・言語反応・運動反応","瞳孔・呼吸・脈拍","見当識・記憶・計算","筋力・感覚・反射"],a:0,e:"GCSは開眼（E：1〜4）、最良言語反応（V：1〜5）、最良運動反応（M：1〜6）の合計3〜15点で評価し、点数が低いほど重症。"},
{id:"se118",f:"seijin",t:"脳神経",q:"頭蓋内圧亢進が進んだときにみられる徴候はどれか。",c:["頻脈と血圧低下","徐脈と血圧上昇","多尿","瞳孔の両側縮小のみ"],a:1,e:"頭痛・嘔吐・うっ血乳頭が三主徴。進むと徐脈・血圧上昇（クッシング現象）、瞳孔不同、意識障害がみられ、脳ヘルニアの危険がある。"},
{id:"se119",f:"seijin",t:"脳神経",q:"第6胸髄より上位の脊髄損傷の患者で、膀胱の充満が誘因となって起こるのはどれか。",c:["自律神経過反射","悪性高熱症","低血糖","テタニー"],a:0,e:"損傷部より下の刺激（膀胱充満・便秘など）で急な血圧上昇・徐脈・頭痛・顔面紅潮が起こる。上半身を起こし、原因（導尿など）を取り除く。"},
{id:"se120",f:"seijin",t:"代謝",q:"2型糖尿病の患者に運動療法を指導するとき、効果的な時間帯はどれか。",c:["起床直後の空腹時","食後1時間ごろ","就寝直前","インスリン注射の直後"],a:1,e:"食後1時間ごろの運動は食後の血糖上昇を抑える。インスリンや一部の内服薬を使用中の人は低血糖に注意し、ブドウ糖を携帯する。"},
{id:"se121",f:"seijin",t:"代謝",q:"糖尿病の患者へのフットケアの指導で適切なのはどれか。",c:["爪は深く丸く切る","爪はまっすぐに切り、角を軽く整える","足は週に1回観察する","素足で過ごす"],a:1,e:"深爪や丸く切ると巻き爪・傷の原因になる。神経障害で傷に気づきにくいため毎日足を観察し、靴下と足に合った靴をはく。"},
{id:"se122",f:"seijin",t:"腎",q:"血液透析中に起こりやすい合併症はどれか。",c:["血圧低下","高血圧緊急症のみ","高カリウム血症の悪化","体重増加"],a:0,e:"除水により循環血液量が減って血圧が下がりやすい。ほかに筋けいれん、不均衡症候群（頭痛・悪心）がみられる。"},
{id:"se123",f:"seijin",t:"腎",q:"腹膜透析で特に注意すべき合併症はどれか。",c:["腹膜炎","心タンポナーデ","網膜剥離","痛風"],a:0,e:"カテーテルの接続操作などで細菌が入ると腹膜炎になる。排液の混濁・腹痛・発熱に注意し、清潔操作を徹底する。"},
{id:"se124",f:"seijin",t:"血液",q:"好中球数が500/μL未満となった患者への指導で適切なのはどれか。",c:["生ものも積極的に食べる","手洗いとうがいを徹底する","人混みに出かけて気分転換する","マスクは不要である"],a:1,e:"好中球減少時は感染しやすく重症化しやすい。手洗い・うがい・口腔ケア・マスク、人混みを避ける、生ものを控えるなどの対策をとる。"},
{id:"se125",f:"seijin",t:"血液",q:"血小板数が著しく減少した患者への指導で適切なのはどれか。",c:["硬い歯ブラシで強くみがく","やわらかい歯ブラシを使う","強く鼻をかむ","カミソリでひげをそる"],a:1,e:"出血を防ぐため、やわらかい歯ブラシや電気シェーバーを使い、強く鼻をかんだり体をぶつけたりしないよう注意する。"},
{id:"se126",f:"seijin",t:"がん看護",q:"放射線療法を受けている患者の照射部位の皮膚のケアで適切なのはどれか。",c:["照射部位を強くこする","マーキングを毎日消して洗う","照射部位をこすらず、刺激を避ける","照射部位に湿布を貼る"],a:2,e:"照射部位は皮膚炎を起こしやすいので、こすらず、締めつけや日光・熱の刺激を避ける。照射位置のマーキングは消さない。"},
{id:"se127",f:"seijin",t:"がん看護",q:"WHO方式がん疼痛治療法の原則に沿った鎮痛薬の使い方はどれか。",c:["痛くなったときだけ使う","時刻を決めて規則正しく使う","できるだけ注射で使う","最初から最も強い薬を最大量使う"],a:1,e:"経口投与を基本とし、時刻を決めて規則正しく、患者ごとに量を調整し、細かい配慮をもって使う。突出痛にはレスキュー薬を用いる。"},
{id:"se128",f:"seijin",t:"がん看護",q:"緩和ケアを開始する時期として適切なのはどれか。",c:["がんと診断されたときから","治療ができなくなってから","余命1か月と告げられてから","亡くなる直前"],a:0,e:"緩和ケアは診断時から治療と並行して行い、身体・心・社会・スピリチュアルな苦痛をやわらげる。"},
{id:"se129",f:"seijin",t:"運動器",q:"前腕のギプス固定後に特に注意すべき所見はどれか。",c:["指を他動的に伸ばすと激しく痛む","ギプスがやや重く感じる","ギプスの表面が乾いてかたい","指を自由に動かせる"],a:0,e:"他動伸展時の激痛・しびれ・蒼白・脈拍の減弱はコンパートメント症候群のサイン。ギプスの圧迫を解除するため、すぐに医師へ報告する。"},
{id:"se130",f:"seijin",t:"運動器",q:"腰椎椎間板ヘルニアでみられる症状はどれか。",c:["下肢のしびれや放散痛","上肢の筋力低下","顔面の感覚障害","嚥下障害"],a:0,e:"飛び出した椎間板が神経根を圧迫し、腰痛と下肢の放散痛・しびれが起こる。L4/5、L5/S1に多い。"},
{id:"se131",f:"seijin",t:"感覚器",q:"白内障の手術後の生活指導で適切なのはどれか。",c:["眼をこすらない","術後すぐにうつむいて洗髪してよい","眼帯の上から強く押さえる","重い物を積極的に持つ"],a:0,e:"感染や創の離開を防ぐため、眼をこすったり押したりしない。洗顔や洗髪は医師の許可が出てから行い、保護眼鏡を使う。"},
{id:"se132",f:"seijin",t:"感覚器",q:"急性緑内障発作でみられる症状はどれか。",c:["急な眼痛・頭痛と悪心・嘔吐","ゆっくり進む視野の中心の欠け","眼脂の増加","まぶたの腫れのみ"],a:0,e:"閉塞隅角緑内障で眼圧が急に上がると、強い眼痛・頭痛・悪心・嘔吐・視力低下が起こる。失明の危険があり緊急処置が必要。"},
{id:"se133",f:"seijin",t:"女性生殖器",q:"子宮頸癌の主な原因はどれか。",c:["ヒトパピローマウイルス〈HPV〉","ヘリコバクター・ピロリ","エストロゲンの不足","EBウイルス"],a:0,e:"子宮頸癌の多くはHPVの持続感染が原因。HPVワクチンと子宮頸がん検診で予防・早期発見ができる。"},
{id:"se134",f:"seijin",t:"乳がん",q:"閉経前の女性が乳房の自己検診を行う時期で適切なのはどれか。",c:["月経が終わって1週間以内","月経の直前","排卵日","いつでもよい"],a:0,e:"月経前は乳房が張りやすいため、張りが落ち着く月経終了後1週間以内に行う。閉経後は毎月日を決めて行う。"},
{id:"se135",f:"seijin",t:"膠原病",q:"全身性エリテマトーデス〈SLE〉の患者への生活指導で適切なのはどれか。",c:["直射日光を避ける","日光浴を積極的にする","ステロイドは自己判断で中止してよい","感染予防は不要"],a:0,e:"SLEは若い女性に多く、日光で症状が悪化しやすい。蝶形紅斑が特徴。ステロイドの自己中断は危険で、感染予防も大切。"},
{id:"se136",f:"seijin",t:"呼吸器",q:"体位ドレナージの方法で正しいのはどれか。",c:["痰がたまっている肺区域を上にする","痰がたまっている肺区域を下にする","必ず座位で行う","食直後に行う"],a:0,e:"重力を利用して痰を中枢気道へ移動させるため、痰がたまっている部位を上にした体位をとる。食直後は嘔吐しやすいので避ける。"},
{id:"se137",f:"seijin",t:"内分泌",q:"甲状腺全摘術後に起こりうる合併症で、テタニーの原因となるのはどれか。",c:["副甲状腺機能低下による低カルシウム血症","高カリウム血症","低血糖","高ナトリウム血症"],a:0,e:"副甲状腺を一緒に切除・損傷すると低カルシウム血症になり、手足のしびれ・テタニーが起こる。反回神経麻痺による嗄声にも注意する。"},
{id:"se138",f:"seijin",t:"消化器",q:"人工肛門（ストーマ）を造設した患者への日常生活の指導で適切なのはどれか。",c:["入浴は一生できない","装具をつけたまま、または外して入浴できる","運動は禁止する","食事はすべて流動食にする"],a:1,e:"ストーマがあっても入浴・運動・旅行はできる。消化しにくい食物やガスの出やすい食品に注意すればよく、食事制限は基本的にない。"}
);

/* ===== 老年看護学（追加） ===== */
Q.push(
{id:"r101",f:"rounen",t:"加齢変化",q:"高齢者の睡眠の特徴はどれか。",c:["深い睡眠が増える","中途覚醒や早朝覚醒が増える","睡眠時間が長くなり熟睡感が増す","入眠までの時間が短くなる"],a:1,e:"加齢で深いノンレム睡眠が減り、眠りが浅く途中で目覚めやすくなる。早寝早起きの傾向も強まる。"},
{id:"r102",f:"rounen",t:"加齢変化",q:"高齢者の感染症の特徴で正しいのはどれか。",c:["必ず高熱が出る","高熱が出にくく、症状がはっきりしないことがある","若年者より回復が速い","咳が出やすく早く気づける"],a:1,e:"高齢者は発熱や咳などの典型的な症状が出にくく、「食欲がない」「元気がない」で肺炎などに気づくことも多い。"},
{id:"r103",f:"rounen",t:"誤嚥性肺炎",q:"高齢者の誤嚥性肺炎の予防に最も効果的なのはどれか。",c:["口腔ケア","水分制限","臥床時間を長くする","食事を急いで食べる"],a:0,e:"口腔内の細菌を減らす口腔ケアは誤嚥性肺炎の予防に効果がある。食後しばらく座位を保つことも大切。"},
{id:"r104",f:"rounen",t:"誤嚥",q:"不顕性誤嚥の説明で正しいのはどれか。",c:["むせを伴わずに誤嚥すること","食事中に激しくむせること","固形物がのどに詰まること","嘔吐物を吐き出すこと"],a:0,e:"不顕性誤嚥は咳反射が弱まり、むせずに唾液などを誤嚥すること。睡眠中に起こりやすく、誤嚥性肺炎の原因になる。"},
{id:"r105",f:"rounen",t:"認知症",q:"アルツハイマー型認知症の初期にみられやすい症状はどれか。",c:["最近の出来事を覚えられない","昔の記憶だけが失われる","幻視が中心","手足の麻痺"],a:0,e:"初期は近時記憶（新しいことを覚える力）が障害され、同じことを何度も聞くなどがみられる。昔の記憶は比較的保たれる。"},
{id:"r106",f:"rounen",t:"認知症",q:"認知症の人とのコミュニケーションで適切なのはどれか。",c:["間違いをその都度強く訂正する","短くわかりやすい言葉で、本人のペースに合わせる","後ろから急に話しかける","複数のことを一度に伝える"],a:1,e:"正面から目線を合わせ、短い言葉で一つずつ伝え、本人の気持ちを否定しない。"},
{id:"r107",f:"rounen",t:"認知症ケア",q:"ユマニチュードの4つの柱に含まれるのはどれか。",c:["触れる","命令する","急がせる","制止する"],a:0,e:"ユマニチュードは「見る・話す・触れる・立つ」を柱としたケア技法。正面から近づき、やさしく触れ、立つ機会を大切にする。"},
{id:"r108",f:"rounen",t:"認知症",q:"アルツハイマー型認知症の治療に用いられる薬はどれか。",c:["ドネペジル","レボドパ","ハロペリドール","インスリン"],a:0,e:"ドネペジルなどのコリンエステラーゼ阻害薬は進行をゆるやかにする。レボドパはパーキンソン病の治療薬。"},
{id:"r109",f:"rounen",t:"認知症施策",q:"2024年1月に施行された認知症に関する法律はどれか。",c:["共生社会の実現を推進するための認知症基本法","介護保険法","老人福祉法","高齢者虐待防止法"],a:0,e:"認知症基本法は、認知症の人が尊厳を保ち希望をもって暮らせる共生社会の実現をめざし、国や自治体の責務などを定めた。"},
{id:"r110",f:"rounen",t:"権利擁護",q:"成年後見人を選任するのはどれか。",c:["市町村長","家庭裁判所","地域包括支援センター","主治医"],a:1,e:"本人・配偶者・親族・市町村長などの申立てにより、家庭裁判所が成年後見人などを選任する。"},
{id:"r111",f:"rounen",t:"権利擁護",q:"判断能力が十分でない人の福祉サービスの利用手続きや日常的な金銭管理を支援する日常生活自立支援事業の実施主体はどれか。",c:["社会福祉協議会","家庭裁判所","保健所","年金事務所"],a:0,e:"日常生活自立支援事業は都道府県・指定都市の社会福祉協議会が実施し、窓口は市町村の社会福祉協議会。本人との契約に基づいて支援する。"},
{id:"r112",f:"rounen",t:"排泄",q:"高齢者に多い便秘の種類はどれか。",c:["弛緩性便秘","けいれん性便秘","器質性便秘","急性便秘"],a:0,e:"腸の動きや腹筋の力が弱くなる弛緩性便秘が多い。水分・食物繊維・運動・排便習慣の確立で予防する。"},
{id:"r113",f:"rounen",t:"排泄",q:"機能性尿失禁のある高齢者への援助で適切なのはどれか。",c:["トイレの場所をわかりやすく表示する","水分を極端に控える","おむつを常に使用する","骨盤底筋訓練だけを行う"],a:0,e:"機能性尿失禁は排尿機能に問題はないが、認知機能やADLの低下でトイレに間に合わないもの。トイレの表示、動線の工夫、排尿パターンに合わせた誘導が有効。"},
{id:"r114",f:"rounen",t:"熱中症",q:"高齢者の熱中症予防の指導で適切なのはどれか。",c:["のどが渇いてから水分をとる","のどが渇く前にこまめに水分をとる","エアコンは使わない","日中に屋外で運動する"],a:1,e:"高齢者は暑さや口渇を感じにくい。時間を決めてこまめに水分をとり、エアコンで室温を調整する。"},
{id:"r115",f:"rounen",t:"骨粗鬆症",q:"骨粗鬆症の予防のための生活指導で適切なのはどれか。",c:["適度に日光を浴びる","カルシウムを控える","運動を避けて安静にする","喫煙を続ける"],a:0,e:"日光を浴びると皮膚でビタミンDがつくられ、カルシウムの吸収を助ける。カルシウムやビタミンD・Kの摂取、適度な運動も大切。"},
{id:"r116",f:"rounen",t:"老年症候群",q:"サルコペニアの説明で正しいのはどれか。",c:["加齢などによる筋肉量・筋力の低下","骨密度の低下","関節軟骨のすり減り","認知機能の低下"],a:0,e:"サルコペニアは筋肉量と筋力・身体機能の低下。たんぱく質の摂取とレジスタンス運動で予防する。"},
{id:"r117",f:"rounen",t:"老年症候群",q:"フレイルの評価項目に含まれるのはどれか。",c:["意図しない体重減少","視力の低下","血圧の上昇","聴力の低下"],a:0,e:"Friedの基準では体重減少・疲れやすさ・歩行速度の低下・握力の低下・身体活動量の低下のうち3項目以上でフレイルとする。適切な介入で健康な状態に戻りうる。"},
{id:"r118",f:"rounen",t:"老年症候群",q:"ロコモティブシンドロームの説明で正しいのはどれか。",c:["運動器の障害で移動機能が低下した状態","認知機能が低下した状態","口腔機能が低下した状態","低栄養の状態"],a:0,e:"ロコモティブシンドロームは骨・関節・筋肉など運動器の障害により、立つ・歩くといった移動機能が低下した状態。"},
{id:"r119",f:"rounen",t:"老年期うつ",q:"高齢者のうつ病の特徴で正しいのはどれか。",c:["身体の不調を強く訴えることが多い","気分の落ち込みを必ず訴える","自殺の危険は低い","認知症と見分ける必要はない"],a:0,e:"高齢者のうつ病は頭痛・食欲不振など身体症状の訴えが多く、認知症と間違われることもある（仮性認知症）。自殺の危険にも注意する。"},
{id:"r120",f:"rounen",t:"褥瘡",q:"ブレーデンスケールの評価項目に含まれるのはどれか。",c:["摩擦とずれ","血圧","体温","認知症の有無"],a:0,e:"ブレーデンスケールは知覚の認知・湿潤・活動性・可動性・栄養状態・摩擦とずれの6項目で褥瘡発生の危険を評価する。点数が低いほど危険が高い。"},

{id:"b111",f:"bosei",t:"分娩",q:"分娩第2期はどれか。",c:["分娩開始から子宮口全開大まで","子宮口全開大から胎児娩出まで","胎児娩出から胎盤娩出まで","胎盤娩出後2時間"],a:1,e:"第1期は分娩開始〜子宮口全開大、第2期は全開大〜胎児娩出、第3期は胎児娩出〜胎盤娩出。"},
{id:"b112",f:"bosei",t:"分娩",q:"前期破水の説明で正しいのはどれか。",c:["陣痛が始まる前に破水すること","子宮口全開大後に破水すること","妊娠22週未満の破水","胎盤娩出後の出血"],a:0,e:"前期破水は陣痛開始前の破水。上行性感染や臍帯脱出に注意し、羊水の色やにおい、体温、胎児心拍を確認する。"},
{id:"b113",f:"bosei",t:"胎児",q:"胎児心拍数の正常範囲はどれか。",c:["60〜100 bpm","110〜160 bpm","170〜200 bpm","200〜240 bpm"],a:1,e:"胎児心拍数基線の正常範囲は110〜160 bpm。分娩監視装置で陣痛との関係もみる。"},
{id:"b114",f:"bosei",t:"産褥",q:"子宮の復古を促すのはどれか。",c:["授乳","長時間の臥床","膀胱の充満","便秘"],a:0,e:"授乳時の乳頭刺激でオキシトシンが分泌され、子宮収縮が促される。膀胱や直腸の充満は子宮収縮を妨げる。"},
{id:"b115",f:"bosei",t:"産褥",q:"後陣痛の特徴で正しいのはどれか。",c:["初産婦のほうが強い","経産婦のほうが強く感じやすい","産褥2週目から始まる","授乳すると弱まる"],a:1,e:"後陣痛は子宮が収縮して元に戻るときの痛みで、産後2〜3日に強く、経産婦で強い傾向がある。授乳時に強くなる。"},
{id:"b116",f:"bosei",t:"授乳",q:"初乳の特徴はどれか。",c:["免疫グロブリンA〈IgA〉を多く含む","脂肪が成乳より多い","白く不透明でさらさらしている","乳糖が成乳より多い"],a:0,e:"初乳は黄色みがかって粘りがあり、IgAやたんぱく質を多く含んで赤ちゃんを感染から守る。"},
{id:"b117",f:"bosei",t:"授乳",q:"母乳育児の進め方で適切なのはどれか。",c:["3時間ごとに時間を決めて与える","赤ちゃんが欲しがるときに欲しがるだけ与える","泣いても次の時間まで待つ","片方の乳房だけで授乳する"],a:1,e:"自律授乳（欲しがるときに欲しがるだけ）が基本。頻回に吸わせることで乳汁の分泌が増える。"},
{id:"b118",f:"bosei",t:"新生児",q:"出生直後の新生児の体温を保つための援助で適切なのはどれか。",c:["皮膚の羊水を拭き取り、温めたタオルで包む","すぐに沐浴させる","裸のまま観察する","冷たい部屋で過ごさせる"],a:0,e:"新生児は体温を保つ力が弱く、濡れた皮膚からの蒸発で熱を失いやすい。すぐに水分を拭き取り保温し、早期母子接触も有効。"},
{id:"b119",f:"bosei",t:"新生児",q:"胎便の特徴で正しいのはどれか。",c:["黒緑色で粘りがあり、生後24時間以内に出る","黄色で水っぽく、生後1週間後に出る","白色で生後すぐに出る","鮮血を含む"],a:0,e:"胎便は黒緑色で粘稠・無臭。生後24時間以内に出ないときは鎖肛やヒルシュスプルング病などを疑う。"},
{id:"b120",f:"bosei",t:"新生児",q:"新生児にビタミンK₂シロップを与える目的はどれか。",c:["新生児黄疸の予防","ビタミンK欠乏性出血症の予防","低血糖の予防","くる病の予防"],a:1,e:"新生児は腸内細菌が少なくビタミンKが不足しやすいため、ビタミンK₂シロップで頭蓋内出血や消化管出血（新生児メレナ）を予防する。"},
{id:"b121",f:"bosei",t:"新生児",q:"新生児の安静時の心拍数に最も近いのはどれか。",c:["60〜80回/分","120〜140回/分","180〜200回/分","220回/分以上"],a:1,e:"新生児の心拍数はおよそ120〜140回/分、呼吸数は40〜50回/分。"},
{id:"b122",f:"bosei",t:"新生児",q:"臍帯が脱落する時期として一般的なのはどれか。",c:["生後1〜2日","生後1〜2週","生後1〜2か月","生後6か月"],a:1,e:"臍帯は乾燥して生後1〜2週で脱落する。臍部は清潔と乾燥を保ち、発赤や悪臭・出血がないか観察する。"},
{id:"b123",f:"bosei",t:"産後のメンタルヘルス",q:"産後うつ病のスクリーニングに用いられる質問票はどれか。",c:["エジンバラ産後うつ病質問票〈EPDS〉","改訂長谷川式簡易知能評価スケール","ブレーデンスケール","バーセルインデックス"],a:0,e:"EPDSは10項目の自己記入式質問票で、産婦健診や新生児訪問で使われる。点数が高ければ詳しい評価と支援につなげる。"},
{id:"b124",f:"bosei",t:"母体保護法",q:"母体保護法で人工妊娠中絶が認められているのはどの時期までか。",c:["妊娠12週未満","妊娠22週未満","妊娠28週未満","妊娠37週未満"],a:1,e:"人工妊娠中絶は母体保護法指定医師により妊娠22週未満に行われる。妊娠12週以降の中絶は死産届が必要。"},
{id:"b125",f:"bosei",t:"出産と制度",q:"2023年4月以降の出産育児一時金の支給額（産科医療補償制度に加入する医療機関での出産）はどれか。",c:["30万円","42万円","50万円","70万円"],a:2,e:"出産育児一時金は2023年4月から50万円に引き上げられた。医療保険から支給される。"},
{id:"b126",f:"bosei",t:"妊娠と生活",q:"妊娠中の飲酒で胎児に起こりうるのはどれか。",c:["胎児性アルコール症候群","新生児黄疸の軽減","巨大児","先天性風疹症候群"],a:0,e:"アルコールは胎盤を通過し、発育の遅れや特徴的な顔貌、中枢神経の障害（胎児性アルコール症候群）を起こしうる。妊娠中は禁酒がすすめられる。"},
{id:"b127",f:"bosei",t:"不妊",q:"日本産科婦人科学会の定義で、不妊とされるのは避妊せずに性交があるのに一定期間妊娠しない場合である。その期間はどれか。",c:["3か月","6か月","1年","3年"],a:2,e:"不妊は一般的に1年間妊娠しない場合とされる。不妊治療（人工授精・体外受精など）は2022年4月から保険適用になった。"},
{id:"b128",f:"bosei",t:"女性の健康",q:"更年期障害の主な原因はどれか。",c:["エストロゲンの減少","プロラクチンの増加","テストステロンの減少","インスリンの増加"],a:0,e:"閉経前後に卵巣機能が低下してエストロゲンが減ることで、ほてり・発汗・動悸・気分の落ち込みなどが起こる。"}
);

/* ===== 精神看護学（追加） ===== */
Q.push(
{id:"ps101",f:"seishin",t:"精神保健福祉法",q:"2024年4月施行の改正精神保健福祉法で、医療保護入院について新たに定められたのはどれか。",c:["入院期間を定め、一定期間ごとに更新の手続きをする","本人の同意だけで入院できる","入院の期限はなくなった","家族の同意は一切不要になった"],a:0,e:"医療保護入院は入院期間（最初の6か月までは3か月以内、その後は6か月以内）を定め、更新するしくみになった。家族等が意思表示しない場合は市町村長の同意で入院できるようになった。"},
{id:"ps102",f:"seishin",t:"精神保健福祉法",q:"2024年の改正精神保健福祉法で創設された、市町村長同意による医療保護入院者などのもとを訪れて話を聴く事業はどれか。",c:["入院者訪問支援事業","地域移行支援","訪問看護","アウトリーチ推進事業"],a:0,e:"入院者訪問支援事業では、研修を受けた訪問支援員が希望する入院者を訪問し、話を聴いて孤独感や不安をやわらげる。"},
{id:"ps103",f:"seishin",t:"精神保健福祉法",q:"精神科病院の業務従事者による虐待を発見した人に、2024年4月から義務づけられたのはどれか。",c:["都道府県への通報","警察への届出のみ","家族への連絡のみ","特に義務はない"],a:0,e:"改正精神保健福祉法により、精神科病院での障害者虐待を発見した人は速やかに都道府県に通報する義務がある。"},
{id:"ps104",f:"seishin",t:"統合失調症",q:"統合失調症の陰性症状はどれか。",c:["幻聴","被害妄想","意欲の低下","思考の混乱"],a:2,e:"陰性症状は意欲低下・感情の平板化・自閉・会話の貧困など、本来あるものが失われる症状。幻覚や妄想は陽性症状。"},
{id:"ps105",f:"seishin",t:"薬物療法",q:"抗精神病薬の長期服用後に、口をもぐもぐさせるなどの不随意運動が現れた。考えられるのはどれか。",c:["遅発性ジスキネジア","アカシジア","急性ジストニア","悪性症候群"],a:0,e:"遅発性ジスキネジアは長期内服後に口や舌、顔の不随意運動として現れ、治りにくい。早期発見のため観察を続ける。"},
{id:"ps106",f:"seishin",t:"気分障害",q:"うつ病の症状はどれか。",c:["朝方に気分が悪く、夕方にやや軽くなる","睡眠時間が短くても元気","観念奔逸","誇大妄想"],a:0,e:"うつ病は気分の日内変動（朝が悪い）、早朝覚醒、食欲低下、興味・喜びの喪失などがみられる。観念奔逸や誇大妄想は躁状態でみられる。"},
{id:"ps107",f:"seishin",t:"気分障害",q:"うつ病の患者への対応で適切なのはどれか。",c:["「頑張って」と励ます","重大な決定は回復するまで先に延ばすよう助言する","気分転換に旅行をすすめる","休むと悪化すると説明する"],a:1,e:"うつ病の急性期は十分な休養が大切で、安易に励まさない。退職や離婚など重大な決定は回復するまで延ばすよう伝える。"},
{id:"ps108",f:"seishin",t:"気分障害",q:"躁状態の患者への対応で適切なのはどれか。",c:["刺激の少ない静かな環境を整える","議論して考えを正す","活動をどんどん広げるようすすめる","多くの人と会わせる"],a:0,e:"躁状態では刺激で興奮しやすい。静かな環境で、短くはっきり伝え、睡眠・食事・水分を確保する。議論は避ける。"},
{id:"ps109",f:"seishin",t:"不安障害",q:"パニック障害の特徴はどれか。",c:["突然の動悸や息苦しさとともに強い不安が起こる","同じ行為を何度も繰り返さずにいられない","特定の物への強い恐怖だけがある","幻聴が続く"],a:0,e:"パニック発作は突然の動悸・呼吸困難・めまいと死ぬのではという恐怖が数分から数十分続く。また起こるのではという予期不安や広場恐怖を伴うことが多い。"},
{id:"ps110",f:"seishin",t:"強迫性障害",q:"強迫性障害の症状はどれか。",c:["何度も手を洗わずにいられない","人前で話すと強い不安が起こる","高い所が怖い","気分が高揚する"],a:0,e:"自分でもばかばかしいと思う考え（強迫観念）が浮かび、それを打ち消す行為（強迫行為：手洗い・確認など）を繰り返す。"},
{id:"ps111",f:"seishin",t:"依存症",q:"アルコール依存症の患者に起こりやすいウェルニッケ脳症の原因はどれか。",c:["ビタミンB₁の欠乏","ビタミンCの欠乏","鉄の欠乏","カルシウムの過剰"],a:0,e:"アルコール依存症では栄養不良からビタミンB₁が欠乏し、ウェルニッケ脳症（意識障害・眼球運動障害・失調）が起こる。慢性化するとコルサコフ症候群（記憶障害・作話）になる。"},
{id:"ps112",f:"seishin",t:"発達障害",q:"注意欠如・多動症〈ADHD〉の特徴はどれか。",c:["不注意・多動性・衝動性","こだわりと対人関係の困難のみ","読み書きだけが極端に苦手","幻覚"],a:0,e:"ADHDは不注意・多動性・衝動性が特徴。自閉スペクトラム症は対人関係・コミュニケーションの困難とこだわり、限局性学習症は読み書きや計算の困難。"},
{id:"ps113",f:"seishin",t:"治療",q:"修正型電気けいれん療法の説明で正しいのはどれか。",c:["全身麻酔と筋弛緩薬を使って行う","意識がある状態で行う","重症のうつ病には効果がない","1回で治療が終わる"],a:0,e:"修正型電気けいれん療法は全身麻酔と筋弛緩薬を用いて安全に行い、薬が効きにくい重症のうつ病などに効果がある。施行前は絶飲食が必要。"},
{id:"ps114",f:"seishin",t:"精神科リハビリテーション",q:"精神障害のある人が地域で生活するための支援として、障害者総合支援法に基づく訓練等給付はどれか。",c:["就労継続支援","精神科救急","措置入院","医療保護入院"],a:0,e:"就労移行支援・就労継続支援（A型・B型）・自立訓練・共同生活援助（グループホーム）などが訓練等給付。"},
{id:"ps115",f:"seishin",t:"リカバリー",q:"精神障害のリカバリーの考え方で正しいのはどれか。",c:["症状が完全に消えることだけを目標にする","病気があっても自分らしい生き方を取り戻していく過程","専門職が生活のすべてを決める","入院を続けることが目標"],a:1,e:"リカバリーは、症状の有無にかかわらず本人が希望をもち、主体的に自分らしい人生を歩んでいく過程。ストレングス（強み）に注目して支援する。"},
{id:"ps116",f:"seishin",t:"防衛機制",q:"受け入れがたい欲求を、社会的に認められる活動に向けかえる防衛機制はどれか。",c:["昇華","抑圧","否認","反動形成"],a:0,e:"昇華は攻撃的な衝動をスポーツに向けるなど、社会的に価値のある形に置き換えること。反動形成は本心と反対の態度をとること。"},
{id:"ps117",f:"seishin",t:"自殺予防",q:"「死にたい」と打ち明けた人への対応で最も適切なのはどれか。",c:["話題を変える","気持ちを受け止め、具体的な計画や手段について尋ねる","「そんなこと言わないで」と叱る","秘密にすると約束して誰にも伝えない"],a:1,e:"自殺について率直に尋ねても危険は高まらない。気持ちを受け止め、計画の具体性を確認し、一人で抱えず専門職や家族と連携して安全を確保する。"},
{id:"ps118",f:"seishin",t:"認知症とせん妄",q:"せん妄の誘因になりやすいのはどれか。",c:["脱水","十分な睡眠","慣れた環境","家族の面会"],a:0,e:"脱水・感染・薬剤（睡眠薬など）・手術・環境の変化・疼痛・便秘などはせん妄の誘因。誘因を取り除くことが予防と治療になる。"},
{id:"ps119",f:"seishin",t:"コミュニケーション",q:"患者が話した内容を自分の言葉で言い換えて返す技法はどれか。",c:["言い換え（反映）","沈黙","保証","忠告"],a:0,e:"言い換えや感情の反映は「わかってもらえた」と感じられ、患者自身が考えを整理する助けになる。根拠のない保証や忠告は避ける。"},
{id:"ps120",f:"seishin",t:"行動制限",q:"精神科病院での身体的拘束の判断を行うのは誰か。",c:["精神保健指定医","看護師長","主治医以外の看護師","家族"],a:0,e:"身体的拘束は精神保健指定医が必要と判断した場合に限り行い、できるだけ早く解除する。拘束中は頻回に観察し、深部静脈血栓症などに注意する。"}
);

/* ===== 地域・在宅看護論（追加） ===== */
Q.push(
{id:"z101",f:"zaitaku",t:"地域包括ケア",q:"地域包括ケアシステムの構成要素はどれか。",c:["住まい・医療・介護・予防・生活支援","病院・診療所・薬局・保健所・学校","年金・医療・介護・雇用・住宅","国・都道府県・市町村・企業・家族"],a:0,e:"住まい・医療・介護・予防・生活支援が一体的に提供されることをめざす。自助・互助・共助・公助の組み合わせで支える。"},
{id:"z102",f:"zaitaku",t:"地域共生社会",q:"地域包括ケアの「自助・互助・共助・公助」のうち、互助にあたるのはどれか。",c:["近所の人やボランティアによる支え合い","介護保険サービス","生活保護","本人による健康管理"],a:0,e:"互助は住民どうしの自発的な支え合い。共助は介護保険など社会保険、公助は税による公的支援（生活保護など）、自助は自分のことを自分でする力。"},
{id:"z103",f:"zaitaku",t:"訪問看護",q:"介護保険の訪問看護を利用するときに必要なのはどれか。",c:["主治医の訪問看護指示書","家族全員の同意書","保健所の許可","介護福祉士の推薦"],a:0,e:"介護保険・医療保険のどちらでも、訪問看護には主治医の訪問看護指示書が必要。介護保険の場合はケアプランにも位置づける。"},
{id:"z104",f:"zaitaku",t:"訪問看護",q:"在宅療養者の初回訪問で最も大切なのはどれか。",c:["信頼関係を築き、本人と家族の思いや生活を知る","家具の配置をすぐに変える","できるだけ多くの指導を一度に行う","家族の介護方法を否定する"],a:0,e:"在宅では療養者の生活の場に訪問させてもらう立場。本人や家族の価値観や生活習慣を尊重し、信頼関係づくりを最優先する。"},
{id:"z105",f:"zaitaku",t:"在宅医療",q:"在宅中心静脈栄養法を行っている人への指導で適切なのはどれか。",c:["輸液バッグの交換は清潔操作で行う","発熱しても様子をみる","カテーテルの刺入部は毎日強くこする","入浴はいつでも自由にしてよい"],a:0,e:"カテーテル関連血流感染を防ぐため清潔操作を守る。発熱・悪寒・刺入部の発赤は感染のサインですぐ連絡する。入浴は指示に従い刺入部を保護する。"},
{id:"z106",f:"zaitaku",t:"在宅医療",q:"在宅で人工呼吸器を使用している療養者の家族への指導で最も重要なのはどれか。",c:["停電やアラーム時の対応方法を確認しておく","回路の点検は不要","加湿器は使わない","緊急時の連絡先は必要ない"],a:0,e:"停電時の外部バッテリーや蘇生バッグの使い方、アラームへの対応、緊急連絡先を家族と確認しておく。災害時個別避難計画も作成しておくとよい。"},
{id:"z107",f:"zaitaku",t:"在宅医療",q:"在宅で膀胱留置カテーテルを使用している人への指導で適切なのはどれか。",c:["水分を控える","蓄尿バッグを膀胱より低い位置に保つ","尿の色やにおいは観察しなくてよい","カテーテルを毎日自分で抜いて入れ直す"],a:1,e:"逆流を防ぐため蓄尿バッグは膀胱より低くし、水分を十分にとって尿量を保つ。尿の混濁・浮遊物・発熱は感染のサイン。"},
{id:"z108",f:"zaitaku",t:"看取り",q:"在宅で看取りを迎える家族への説明で適切なのはどれか。",c:["亡くなる前に起こりうる変化（呼吸の変化など）と対応を事前に伝える","呼吸が止まったらすぐに救急車を呼ぶよう伝える","最期の時期の話はしない","家族は何もしないよう伝える"],a:0,e:"下顎呼吸など予測される変化と、そのとき誰に連絡するかを事前に伝えておく。本人の意思に反して救急搬送や蘇生が行われないよう、かかりつけ医や訪問看護師への連絡方法を確認する。"},
{id:"z109",f:"zaitaku",t:"介護保険",q:"介護保険の福祉用具貸与の対象となるのはどれか。",c:["車いす","入浴用いす","腰掛便座","自動排泄処理装置の交換可能部品"],a:0,e:"車いす・特殊寝台・手すり・歩行器などは貸与（レンタル）、入浴用いす・腰掛便座など直接肌に触れる物は特定福祉用具販売の対象。"},
{id:"z110",f:"zaitaku",t:"介護保険",q:"介護保険の住宅改修の対象となるのはどれか。",c:["手すりの取り付け","エアコンの設置","浴槽の新品への交換（段差解消を伴わない）","家全体の建て替え"],a:0,e:"手すりの取り付け、段差の解消、滑り防止のための床材変更、引き戸への扉の取り替え、洋式便器への取り替えなどが対象。支給限度額は原則20万円。"},
{id:"z111",f:"zaitaku",t:"退院支援",q:"退院前カンファレンスの目的で最も適切なのはどれか。",c:["病院と在宅の支援者が情報を共有し、退院後の生活に向けた支援を調整する","入院中の医療費を計算する","退院日を家族に知らせるだけ","病棟の看護師だけで退院後の生活を決める"],a:0,e:"本人・家族、病院の医療者、ケアマネジャー、訪問看護師などが集まり、退院後の生活の課題と必要なサービスを話し合う。"},
{id:"z112",f:"zaitaku",t:"多職種連携",q:"在宅療養者の口腔機能の評価や訓練を主に担う職種はどれか。",c:["歯科衛生士","臨床検査技師","社会福祉士","診療放射線技師"],a:0,e:"歯科医師・歯科衛生士は訪問歯科診療で口腔ケアや口腔機能の訓練を行う。嚥下機能の訓練は言語聴覚士とも連携する。"},
{id:"z113",f:"zaitaku",t:"家族支援",q:"在宅療養者を介護する家族への支援で適切なのはどれか。",c:["介護者自身の健康状態にも目を向ける","介護はすべて家族だけで行うよう伝える","家族の疲れには触れない","レスパイトケアは勧めない"],a:0,e:"介護者の疲労や健康状態、仕事との両立などにも目を向け、サービスやレスパイトを活用して介護を続けられるよう支える。"},
{id:"z114",f:"zaitaku",t:"災害への備え",q:"在宅で医療機器を使用している人の災害への備えとして適切なのはどれか。",c:["停電に備えて予備バッテリーを準備し、避難方法を事前に決めておく","災害時は自宅にとどまるだけでよい","医療機器の情報は誰にも伝えない","薬の予備は持たない"],a:0,e:"予備バッテリーや手動式の器具、数日分の薬や衛生材料を準備し、市町村の避難行動要支援者名簿や個別避難計画を活用する。"},
{id:"z115",f:"zaitaku",t:"地域看護",q:"保健師が地域の健康課題を明らかにするために、地区を歩いて観察する活動はどれか。",c:["地区踏査","家庭訪問","健康教育","特定保健指導"],a:0,e:"地区踏査（地区視診）では地域を歩き、住民の生活環境や社会資源を観察して健康課題を把握する。"},
{id:"z116",f:"zaitaku",t:"在宅医療",q:"在宅でのストーマ装具の交換で適切なのはどれか。",c:["皮膚を石けんで洗ってよく乾かしてから貼る","面板の穴はストーマより大きく切ってよい","毎回アルコールで消毒する","皮膚が赤くても気にしなくてよい"],a:0,e:"ストーマ周囲は石けんで洗い、よく乾かしてから装具を貼る。皮膚障害がないか毎回観察する。"},
{id:"z117",f:"zaitaku",t:"地域連携",q:"在宅療養者の情報を多職種で共有するときに大切なことはどれか。",c:["本人の同意を得て必要な範囲で共有する","すべての情報を誰にでも伝える","情報は一切共有しない","家族の同意だけで本人には知らせない"],a:0,e:"多職種で情報共有するときは本人の同意を基本とし、目的に必要な範囲で行う。ICTを使うときも安全管理に配慮する。"},
{id:"z118",f:"zaitaku",t:"看取り",q:"在宅での死亡時の対応で正しいのはどれか。",c:["継続して診療していた医師は、死亡後に診察して死亡診断書を交付できる","医師以外の職種も死亡診断書を交付できる","必ず警察に届け出る","必ず病院に搬送して死亡を確認する"],a:0,e:"かかりつけ医が死亡後に診察し、診療中の疾患による死亡と判断すれば死亡診断書を交付できる。異状死の場合は警察に届け出る。"}
);

/* ===== 看護の統合と実践（追加） ===== */

{id:"t103",f:"tougou",t:"災害看護",q:"災害サイクルで、被災後の生活が落ち着き復興に向かう時期に特に注意する健康問題はどれか。",c:["慢性疾患の悪化や孤立・孤独死","挫滅症候群","熱傷","骨折"],a:0,e:"復旧・復興期には仮設住宅などでの生活の長期化により、慢性疾患の悪化、閉じこもり、アルコール問題、孤独死などが課題になる。"},
{id:"t104",f:"tougou",t:"災害看護",q:"倒壊した建物の下敷きになり長時間圧迫された後、救出時に起こりうるのはどれか。",c:["挫滅症候群（クラッシュ症候群）","熱中症","過換気症候群","一酸化炭素中毒"],a:0,e:"圧迫が解除されると壊れた筋肉からカリウムやミオグロビンが流れ出し、高カリウム血症による不整脈や急性腎障害を起こす。"},

{id:"t106",f:"tougou",t:"医療安全",q:"口頭指示を受けるときの対応で適切なのはどれか。",c:["復唱して確認し、記録に残す","聞き取れなくても推測で実施する","指示を受けた後は誰にも伝えない","指示内容をメモせずに記憶する"],a:0,e:"口頭指示は間違いが起こりやすいため、緊急時に限り、復唱確認し、速やかに記録に残して後で指示者に確認してもらう。"},

{id:"t108",f:"tougou",t:"チーム医療",q:"栄養サポートチーム〈NST〉の役割はどれか。",c:["患者の栄養状態を評価し適切な栄養管理を提案する","感染症の発生を監視する","褥瘡の手術を行う","退院後の住宅を探す"],a:0,e:"NSTは医師・看護師・管理栄養士・薬剤師などで構成され、栄養状態の評価と栄養療法を提案する。感染対策はICT（感染対策チーム）。"},
{id:"t109",f:"tougou",t:"国際看護",q:"国際協力機構〈JICA〉の主な活動はどれか。",c:["開発途上国への技術協力や人材派遣","国際的な看護師の倫理綱領の策定","国内の災害医療","医療保険の運営"],a:0,e:"JICAは政府開発援助（ODA）の実施機関で、青年海外協力隊などとして看護師も派遣している。倫理綱領の策定はICN。"},
{id:"t110",f:"tougou",t:"国際看護",q:"日本に住む外国人患者への看護で適切なのはどれか。",c:["必要に応じて医療通訳を活用する","日本の習慣に必ず合わせてもらう","家族の子どもに通訳を頼むのが最もよい","宗教的な配慮は不要"],a:0,e:"医療通訳や翻訳ツールを活用し、文化・宗教による食事や習慣の違いを尊重する。病状説明を子どもに通訳させるのは負担が大きく避ける。"},
{id:"t111",f:"tougou",t:"看護管理",q:"看護職員の夜勤負担を減らすための取り組みとして適切なのはどれか。",c:["勤務と勤務の間に十分な休息時間（勤務間インターバル）を確保する","連続夜勤を増やす","休憩時間をなくす","夜勤の人数を減らす"],a:0,e:"日本看護協会のガイドラインでは、勤務間インターバル11時間以上の確保、連続夜勤の制限などが示されている。"},
{id:"t112",f:"tougou",t:"多重課題",q:"夜勤中、同時に次の対応が必要になった。最も優先するのはどれか。",c:["定時の点滴交換","トイレに行きたいというナースコール","ベッドから転落して頭を打った患者の対応","翌朝の検査の準備"],a:2,e:"転落による頭部打撲は意識障害などの急変の危険があり最優先。他の業務は応援を依頼したり、時間を調整したりする。"},
{id:"t113",f:"tougou",t:"看護の倫理",q:"日本看護協会の「看護職の倫理綱領」に示されている内容はどれか。",c:["人々の生きる権利・尊厳を保つ権利を尊重する","看護職は医師の指示にのみ従う","看護職は自分の健康には責任をもたない","個人情報は自由に共有してよい"],a:0,e:"看護職の倫理綱領（2021年）は、人間の尊厳・権利の尊重、平等な看護、守秘義務、自己の健康の保持、専門職としての研鑽などを示している。"},
{id:"t114",f:"tougou",t:"感染管理",q:"感染対策チーム〈ICT〉の活動はどれか。",c:["院内感染の監視（サーベイランス）と対策の指導","手術の執刀","患者の食事の調理","医療費の請求"],a:0,e:"ICTは感染症の発生状況の監視、感染対策の指導・教育、アウトブレイク時の対応などを行う。"},

/* ===== 状況設定問題（追加） ===== */

    const ans = round0(v * 20 / (h * 60));
    return {t:"滴下数（成人用）", q:`成人用輸液セット（20滴≒1 mL）を用いて、輸液${v} mLを${h}時間で滴下する。1分間の滴下数を求めよ。\n※小数点以下第1位を四捨五入する。`, ans, unit:"滴/分",
      e:`1分間の滴下数＝総量(mL)×1 mLあたりの滴数÷時間(分)\n＝${v}×20÷(${h}×60)＝${(v * 20 / (h * 60)).toFixed(2)} → ${ans}滴/分`};
  },
  function childDrip(){
    const v = pick([100, 150, 200, 240, 300, 360, 480, 500]), h = pick([2, 4, 5, 6, 8, 10, 12, 24]);
    const ans = round0(v * 60 / (h * 60));
    return {t:"滴下数（小児用）", q:`小児用（微量）輸液セット（60滴≒1 mL）を用いて、輸液${v} mLを${h}時間で滴下する。1分間の滴下数を求めよ。\n※小数点以下第1位を四捨五入する。`, ans, unit:"滴/分",
      e:`${v}×60÷(${h}×60)＝${(v / h).toFixed(2)} → ${ans}滴/分\n60滴≒1 mLのセットでは「1分間の滴下数＝1時間あたりのmL数」になる。`};
  },
  function pump(){
    const h = pick([4, 5, 6, 8, 10, 12, 16, 24]), rate = ri(2, 25) * 5, v = rate * h;
    return {t:"輸液ポンプの流量", q:`輸液${v} mLを輸液ポンプで${h}時間かけて投与する。流量（mL/時）を求めよ。`, ans:rate, unit:"mL/時",
      e:`流量＝総量÷時間＝${v}÷${h}＝${rate} mL/時`};
  },
  function dose(){
    const conc = pick([2, 5, 10, 20, 25, 50]), ml = pick([0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8]), mg = conc * ml;
    const ok = Number.isInteger(ml);
    if(!ok) return CALC_GEN[3]();
    return {t:"薬液量", q:`「${mg} mgを静脈内注射」の指示があった。薬液は1 mLあたり${conc} mgを含む。必要な薬液量（mL）を求めよ。`, ans:ml, unit:"mL",
      e:`必要量＝指示量÷濃度＝${mg}÷${conc}＝${ml} mL`};
  },
  function dilute(){
    const stock = pick([5, 6, 10]), target = pick([0.02, 0.05, 0.1]), total = pick([500, 1000, 1500, 2000, 3000]);
    const raw = Math.round(total * target / stock * 1000) / 1000;
    if(!Number.isInteger(raw)) return CALC_GEN[4]();
    return {t:"希釈", q:`${stock}%次亜塩素酸ナトリウム液を用いて、${target}%の消毒液を${total} mLつくる。必要な原液の量（mL）を求めよ。`, ans:raw, unit:"mL",
      e:`原液量＝つくる量×つくる濃度÷原液の濃度\n＝${total}×${target}÷${stock}＝${raw} mL`};
  },
  function oxygen(){
    const p = pick([5, 7, 8, 10, 12]), f = pick([1, 2, 3, 4, 5]);
    const remain = 500 * p / 14.7, min = Math.floor(remain / f);
    return {t:"酸素ボンベ", q:`500 L酸素ボンベ（満充填時14.7 MPa）の圧力計が${p} MPaを示している。酸素を${f} L/分で投与するとき、使用可能時間（分）を求めよ。\n※安全係数は考えず、小数点以下を切り捨てる。`, ans:min, unit:"分",
      e:`残量＝500×${p}÷14.7＝${remain.toFixed(1)} L\n使用可能時間＝${remain.toFixed(1)}÷${f}＝${(remain / f).toFixed(1)} → ${min}分\n実際の臨床では安全係数（0.8など）をかけて余裕をもたせる。`};
  },
  function bmi(){
    const hcm = ri(148, 182), w = ri(40, 95), b = w / Math.pow(hcm / 100, 2), ans = round0(b);
    return {t:"BMI", q:`身長${hcm} cm、体重${w} kgの成人のBMIを求めよ。\n※小数点以下第1位を四捨五入する。`, ans, unit:"",
      e:`BMI＝体重(kg)÷身長(m)²＝${w}÷(${(hcm / 100).toFixed(2)})²＝${b.toFixed(2)} → ${ans}\n日本肥満学会の基準では18.5未満が低体重、25以上が肥満。`};
  }
];

function randDigits(n){ const a = new Uint32Array(n); try{ crypto.getRandomValues(a); }catch(e){ for(let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 1e9); } return Array.from(a, (x, i) => i === 0 ? 1 + x % 9 : x % 10).join(""); }

function defaultState(){
  return {v: 1, lv: 1, xp: 0, coins: 10, tot: {n: 0, c: 0}, fs: {}, qs: {}, wrong: {}, cases: {},

function normalize(o){

  if(!s.study.days || typeof s.study.days !== "object" || Array.isArray(s.study.days)) s.study.days = {};
  if(!s.study.run || !(+s.study.run.s > 0)) s.study.run = null;
  const so = (s.social && typeof s.social === "object") ? s.social : {};
  const ns = newSocial();
  s.social = {id: typeof so.id === "string" && so.id ? so.id : ns.id, code: /^\d{8}$/.test(so.code || "") ? so.code : ns.code, name: typeof so.name === "string" ? so.name.slice(0, 16) : "", on: so.on === undefined ? !!so.name : !!so.on,
    groups: Array.isArray(so.groups) ? so.groups.filter(g => g && /^\d{8}$/.test(g.code)) : [], friends: Array.isArray(so.friends) ? so.friends.filter(f => f && /^\d{8}$/.test(f.code)) : [],
    show: Object.assign(ns.show, so.show || {}), share: Object.assign(ns.share, so.share || {})};
  if(!CHARS[s.char]) s.char = "piyo";
  s.babies = Array.isArray(s.babies) ? s.babies.filter(b => b && typeof b.id === "string" && CHARS[b.sp] && b.base && typeof b.base === "object").slice(0, 3) : [];
  if(!s.birthDays || typeof s.birthDays !== "object" || Array.isArray(s.birthDays)) s.birthDays = {};
  s.lv = Math.max(1, +s.lv || 1); s.xp = Math.max(0, +s.xp || 0); s.coins = Math.max(0, +s.coins || 0);

/* ---------- クラウド同期（本人だけが読める非公開ドキュメント） ---------- */
const Sync = {
  ref: null, state: "local", timer: null, writing: false, again: false, retried: false, readonly: false,
  set(st){
    this.state = st;
    const label = {local: "この端末に保存中", connecting: "クラウドに接続中…", synced: "クラウドに同期済み", saving: "保存中…"}[st] || "この端末に保存中";
    document.querySelectorAll("[data-sync]").forEach(el => { el.textContent = label; el.dataset.state = st; });
  },
  queue(delay){
    if(!this.ref || this.readonly) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), delay == null ? 900 : delay);
  },
  async push(){
    if(!this.ref || this.readonly) return;
    if(this.writing){ this.again = true; return; }
    this.writing = true; this.set("saving");
    try{
      await this.ref.set(JSON.parse(JSON.stringify(S)));
      this.retried = false; this.set("synced");
    }catch(e){
      const code = e && e.code;
      if(code === "unavailable" && !this.retried){ this.retried = true; this.writing = false; setTimeout(() => this.queue(0), 800 + Math.random() * 1200); return; }
      if(["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed", "quota_exceeded"].includes(code)) this.readonly = true;
      this.set("local");
    }
    this.writing = false;
    if(this.again){ this.again = false; this.queue(300); }
  },
  db: null, uid: null, ready: null, unsub: null, accTimer: null,
  adopt(r){
    const n = normalize(JSON.parse(JSON.stringify(r)));
    if(n.social.id !== ACC.current){ n.social.id = ACC.current; n.social.name = S.social.name || n.social.name; n.char = S.char; }
    S = n; ensureDay(); saveLocal();
    if(!G) render();
  },
  connect(){
    if(this.ready) return this.ready;
    this.ready = (async () => {
      const cl = window.claude;
      if(!cl || typeof cl.use !== "function") return false;
      let db = null, user = null;
      try{ const r = await Promise.all([cl.use("db"), cl.use("user")]); db = r[0]; user = r[1]; }catch(e){}
      if(!db || !user) return false;
      let uid = null;
      try{ uid = await user.id(); }catch(e){}
      if(!uid) return false;
      this.db = db; this.uid = uid; return true;
    })();
    return this.ready;
  },
  /* 別の端末で作ったアカウントの一覧を取り込む */
  async boot(){
    if(!window.claude || typeof window.claude.use !== "function") return false;
    if(!(await this.connect())) return false;
    try{
      const snap = await this.db.doc("data/users/" + this.uid + "/accounts").get();
      const r = snap.exists ? snap.data() : null;
      if(!r || !Array.isArray(r.list)) return false;
      let changed = false;
      r.list.forEach(x => { if(x && typeof x.id === "string" && !ACC.list.some(y => y.id === x.id)){ ACC.list.push({id: x.id, name: String(x.name || ""), char: x.char, lv: +x.lv || 1, created: +x.created || 0}); changed = true; } });
      if(!changed) return false;
      if(!ACC.current){ ACC.current = ACC.list[0].id; S = loadAccountState(ACC.current); }
      try{ localStorage.setItem(ACC_KEY, JSON.stringify(ACC)); }catch(e){}
      return true;
    }catch(e){ return false; }
  },
  pushAccounts(){
    if(!this.db) return;
    clearTimeout(this.accTimer);
    this.accTimer = setTimeout(async () => { try{ await this.db.doc("data/users/" + this.uid + "/accounts").set({list: JSON.parse(JSON.stringify(ACC.list)), updatedAt: Date.now()}); }catch(e){} }, 1500);
  },
  async init(){
    if(this.unsub){ try{ this.unsub(); }catch(e){} this.unsub = null; }
    clearTimeout(this.timer); this.ref = null; this.readonly = false;
    if(!ACC.current || !window.claude || typeof window.claude.use !== "function"){ this.set("local"); return; }
    this.set("connecting");
    if(!(await this.connect())){ this.set("local"); return; }
    const acc = ACC.current;
    let ref;
    try{ ref = this.db.doc("data/users/" + this.uid + "/acc-" + acc); }catch(e){ this.set("local"); return; }
    try{
      const snap = await ref.get();
      if(acc !== ACC.current) return;
      this.ref = ref;
      let r = snap.exists ? snap.data() : null;
      if(!r && ACC.list.length === 1 && S.tot.n === 0){
        /* アカウント機能より前にクラウドへ保存していた記録を引き継ぐ */
        try{ const old = await this.db.doc("data/users/" + this.uid + "/state").get(); if(old.exists){ this.adopt(old.data()); this.queue(0); } }catch(e){}
      }
      const ru = (r && +r.updatedAt) || 0;
      if(r && ru > S.updatedAt){ this.adopt(r); this.set("synced"); }
      else if(S.updatedAt > ru) this.queue(0);
      else this.set("synced");
    }catch(e){ this.ref = null; this.set("local"); return; }
    this.pushAccounts();
    try{
      this.unsub = ref.onSnapshot(snap => {
        if(acc !== ACC.current || !snap || !snap.exists || (snap.metadata && snap.metadata.hasPendingWrites)) return;
        const r = snap.data();
        if(r && (+r.updatedAt || 0) > S.updatedAt){ this.adopt(r); toast("別の端末の記録を反映しました"); }
      }, () => {});
    }catch(e){}
  }
};

  const ratio = pool.length ? mastered / pool.length : 0;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio >= .3 ? 1 : 0;
  return {total: pool.length, mastered, ratio, stars, n: fs.n, c: fs.c, acc: pct(fs.c, fs.n)};
}
function accOf(keys){ let n = 0, c = 0; keys.forEach(k => { const f = S.fs[k]; if(f){ n += f.n; c += f.c; } }); return {n, c, p: pct(c, n)}; }
function wrongIds(){ return Object.keys(S.wrong).filter(id => QMAP[id]); }

/* ---------- 解答の記録・XP ---------- */
function recordAnswer(q, ok){
  ensureDay();
  const t = todayStr();
  S.tot.n++; if(ok) S.tot.c++;
  const f = S.fs[q.f] || (S.fs[q.f] = {n: 0, c: 0});
  f.n++; if(ok) f.c++;
  const r = S.qs[q.id] || (S.qs[q.id] = {n: 0, c: 0, last: 0});
  r.n++; if(ok) r.c++; r.last = ok ? 1 : 0; r.ts = Date.now();
  if(ok){
    const w = S.wrong[q.id];
    if(w){ w.ok = (w.ok || 0) + 1; if(w.ok >= 2) delete S.wrong[q.id]; }
  } else {
    S.wrong[q.id] = {t: Date.now(), ok: 0};
  }
  S.act[t] = (S.act[t] || 0) + 1;
  S.day.n++;
  if(ok){ S.day.c++; S.day.combo++; S.day.maxCombo = Math.max(S.day.maxCombo, S.day.combo); }
  else S.day.combo = 0;
}
let pendingLv = [];
function addXP(n){
  S.xp += Math.max(0, Math.round(n));
  while(S.xp >= xpNeed(S.lv)){
    S.xp -= xpNeed(S.lv); S.lv++;
    pendingLv.push(S.lv);
  }
}
function addCoins(n){ S.coins += Math.max(0, Math.round(n)); }

function claimMissions(){

    if(m.cur >= m.need && !S.day.got[m.id]){ S.day.got[m.id] = 1; addCoins(10); addXP(15); done.push(m.t); }
  });

}
function checkBadges(){
  const got = [];
  BADGES.forEach(b => { if(!S.badges[b.id]){ let ok = false; try{ ok = b.ok(S); }catch(e){} if(ok){ S.badges[b.id] = Date.now(); got.push(b.n); } } });

  if(est == null) return `<div><div class="xpline"><span>${label}</span><span>まだデータがありません</span></div><div class="bar"><i style="width:0"></i></div></div>`;

/* ===== ゲーム本体 ===== */
let G = null;
const MODE_NAME = {field: "分野クエスト", mix: "おまかせ10問", hitsu: "必修チャレンジ", ta: "タイムアタック", sv: "サバイバル", calc: "計算ドリル", "case": "状況設定バトル", mock: "ミニ模試", review: "間違いノート復習", one: "1問復習"};
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickQs(pool, n){
  const fresh = [], wrong = [], rest = [];
  shuffle(pool).forEach(q => { const r = S.qs[q.id]; (!r ? fresh : r.last === 0 ? wrong : rest).push(q); });
  rest.sort((a, b) => (S.qs[a.id].ts || 0) - (S.qs[b.id].ts || 0));
  return fresh.concat(wrong, rest).slice(0, n);
}
/* 選択肢の並びは出題のたびに入れ替える（数値の選択肢は小さい順のまま） */
function makeOrd(q){ const idx = q.c.map((_, i) => i); return q.c.every(c => /\d/.test(c)) ? idx : shuffle(idx); }
const qItem = q => ({kind: "q", q, ord: makeOrd(q)});
const withOrd = list => { list.forEach(it => { if(it.kind === "q" && !it.ord) it.ord = makeOrd(it.q); }); return list; };
function isMulti(q){ return Array.isArray(q.a); }
function judge(q, sel){
  if(isMulti(q)) return sel.length === q.a.length && q.a.every(x => sel.includes(x));
  return sel[0] === q.a;
}

function startGame(mode, arg){
  ensureDay();
  let items = [], extra = {};
  if(mode === "field"){ items = pickQs(poolOf(arg), 5).map(qItem); extra.field = arg; }
  else if(mode === "mix"){ items = pickQs(Q, 10).map(qItem); }
  else if(mode === "hitsu"){ items = pickQs(poolOf("hitsu"), 10).map(qItem); }
  else if(mode === "ta" || mode === "sv"){ items = shuffle(Q).map(qItem); }
  else if(mode === "calc"){ items = shuffle(CALC_GEN).slice(0, 5).map(fn => ({kind: "calc", c: fn()})); }
  else if(mode === "case"){
    let cs = CASES.find(c => c.id === arg);
    if(!cs){ const cand = CASES.filter(c => S.cases[c.id] !== 3); cs = pick(cand.length ? cand : CASES); }
    items = cs.qs.map(q => ({kind: "q", q, story: cs})); extra.cs = cs.id; extra.genki = 25;
  }
  else if(mode === "mock"){
    const cs = shuffle(CASES).slice(0, 2);
    items = pickQs(poolOf("hitsu"), 10).map(q => ({kind: "q", q, sec: "hitsu"}))
      .concat(pickQs(Q.filter(q => q.f !== "hitsu"), 15).map(q => ({kind: "q", q, sec: "gen"})))
      .concat(...cs.map(c => c.qs.map(q => ({kind: "q", q, story: c, sec: "case"}))));
  }
  else if(mode === "review"){
    const ids = wrongIds().filter(id => UI.rv === "all" || QMAP[id].f === UI.rv).sort((a, b) => S.wrong[b].t - S.wrong[a].t).slice(0, 10);
    items = shuffle(ids).map(id => qItem(QMAP[id]));
  }
  else if(mode === "one"){ if(QMAP[arg]) items = [qItem(QMAP[arg])]; }
  withOrd(items);
  if(!items.length){ toast("出題できる問題がありません"); return; }
  G = Object.assign({mode, arg: arg || "", items, i: 0, sel: [], done: false, answered: false, res: [], combo: 0, xp: 0, coins: 0, input: "", lives: 3, time: 60, t0: Date.now()}, extra);
  if(mode === "ta") startTimer();
  unlockAudio();
  render(); window.scrollTo(0, 0);
}
function startTimer(){
  clearInterval(G.timerId);
  G.timerId = setInterval(() => {
    if(!G || G.mode !== "ta") return;
    G.time = Math.max(0, G.time - 1);
    const el = $("#ta-time"); if(el) el.textContent = G.time;
    if(G.time <= 0){ clearInterval(G.timerId); finishGame(); }
  }, 1000);
}
const curItem = () => G.items[G.i];

/* ---------- 問題画面 ---------- */
function viewGame(){
  const it = curItem();
  const total = (G.mode === "ta" || G.mode === "sv") ? null : G.items.length;
  let head = `<div class="qhead"><button class="qx" data-act="quit-ask" aria-label="やめる">✕</button><div class="qprog">`;
  if(total) head += `<div class="bar"><i style="width:${pct(G.i + (G.answered ? 1 : 0), total)}%"></i></div>`;
  else if(G.mode === "sv") head += `<div class="hearts" aria-label="残りハート${G.lives}">${[0, 1, 2].map(i => SVGI.heart(i < G.lives)).join("")}</div>`;
  else head += `<div class="bar"><i style="width:${Math.round(G.time / 60 * 100)}%;background-color:var(--peach)"></i></div>`;
  head += `</div>`;
  if(G.mode === "ta") head += `<span class="timer num" id="ta-time" aria-live="off">${G.time}</span>`;
  else head += `<span class="qcount num">${total ? `${G.i + 1}/${total}` : `${G.res.filter(r => r.ok).length}問正解`}</span>`;
  head += `</div>`;
  const combo = G.combo >= 2 ? `<span class="combo">${G.combo}コンボ！</span>` : "";
  let body = "";
  if(it.kind === "calc") body = viewCalc(it);
  else body = viewQ(it);
  return head + `<div class="row" style="justify-content:space-between;min-height:22px"><span class="pop small">${esc(MODE_NAME[G.mode])}</span>${combo}</div>` + body;
}
function caseHead(cs){
  const g = G.mode === "case" ? `<div class="genki"><span>元気ゲージ</span><div class="bar thin"><i style="width:${G.genki}%"></i></div></div>` : "";
  const mood = G.mode === "case" ? (G.genki >= 90 ? "good" : G.genki <= 15 ? "bad" : "mid") : "mid";
  return `<div class="card tint-peach stack" style="gap:8px;padding:12px"><div class="patient"><span class="face">${patientSVG(mood)}</span><div><b class="pop" style="font-size:.95rem">${esc(cs.title)}</b><p class="small sub" style="font-weight:800">${esc(cs.who)}</p></div></div>${g}<div class="story">${cs.story}</div></div>`;
}
function viewQ(it){
  const q = it.q, f = FMAP[q.f], multi = isMulti(q), ans = G.answered;
  const correct = multi ? q.a : [q.a];
  let h = it.story ? caseHead(it.story) : "";
  h += `<section class="card qcard"><div class="qmeta"><span class="tag" style="background:var(--${f.col}-s)">${esc(f.n)}</span>${q.t ? `<span class="tag">${esc(q.t)}</span>` : ""}${it.story ? '<span class="tag" style="background:var(--lemon-s)">状況設定・2点</span>' : ""}</div>`;
  h += `<p class="qtext">${esc(q.q)}</p>${multi ? '<p class="multi-hint">2つ選んでから「こたえる」をタップ</p>' : ""}`;
  const ord = it.ord || q.c.map((_, i) => i);
  h += `<div class="choices">${ord.map((i, pos) => {
    const c = q.c[i];
    let cls = "";
    if(ans){ if(correct.includes(i)) cls = " ok"; else if(G.sel.includes(i)) cls = " ng"; else cls = " dim"; }
    else if(G.sel.includes(i)) cls = " sel";
    return `<button class="choice${cls}" data-act="choose:${pos}" ${ans ? "disabled" : ""}><span class="k">${pos + 1}</span><span>${esc(c)}</span></button>`;
  }).join("")}</div>`;
  if(multi && !ans) h += `<button class="btn big sky block" data-act="submit" ${G.sel.length === 2 ? "" : "disabled"}>こたえる</button>`;
  h += `</section>`;
  if(ans && G.mode !== "ta"){
    const ok = G.res[G.res.length - 1].ok;
    h += `<section class="explain ${ok ? "okx" : "ngx"}" aria-live="polite"><h3>${ok ? "せいかい！" : "ざんねん…"}</h3>
      <p class="ans">正解：${correct.map(i => [ord.indexOf(i), i]).sort((x, y) => x[0] - y[0]).map(([pos, i]) => (pos + 1) + "．" + esc(q.c[i])).join("　")}</p><p>${esc(q.e)}</p></section>`;
    h += `<button class="btn big pink block" data-act="next" id="next-btn">${nextLabel()}</button>`;
  }
  return h;
}
function nextLabel(){
  if(G.mode === "sv" && G.lives <= 0) return "結果を見る";
  if(G.i + 1 >= G.items.length) return "結果を見る";
  return "つぎへ";
}
function viewCalc(it){
  const c = it.c, ans = G.answered;
  let h = `<section class="card qcard"><div class="qmeta"><span class="tag" style="background:var(--mint-s)">計算ドリル</span><span class="tag">${esc(c.t)}</span></div><p class="qtext">${esc(c.q)}</p>
    <div class="calc-disp" aria-live="polite"><b class="num">${esc(G.input || (ans ? "" : "?"))}</b><span>${esc(c.unit)}</span></div>`;
  if(!ans){
    h += `<div class="keypad">${[7, 8, 9, 4, 5, 6, 1, 2, 3].map(d => `<button class="btn" data-act="key:${d}">${d}</button>`).join("")}<button class="btn" data-act="key-del" aria-label="1文字消す">←</button><button class="btn" data-act="key:0">0</button><button class="btn mint" data-act="key-ok" ${G.input ? "" : "disabled"}>OK</button></div>`;
  }

    const ok = G.res[G.res.length - 1].ok;
    h += `<section class="explain ${ok ? "okx" : "ngx"}"><h3>${ok ? "せいかい！" : "ざんねん…"}</h3><p class="ans">正解：${c.ans} ${esc(c.unit)}</p><p style="white-space:pre-line">${esc(c.e)}</p></section>
      <button class="btn big pink block" data-act="next" id="next-btn">${nextLabel()}</button>`;

/* ---------- 解答処理 ---------- */
function choose(pos){
  if(!G || G.answered) return;
  const it = curItem(), q = it.q;
  const i = it.ord ? it.ord[pos] : pos;
  if(i === undefined) return;
  if(isMulti(q)){
    if(G.sel.includes(i)) G.sel = G.sel.filter(x => x !== i);
    else if(G.sel.length < 2) G.sel.push(i);
    render(); return;
  }
  G.sel = [i]; answer();
}
function answer(){
  const it = curItem();
  const ok = it.kind === "calc" ? (+G.input === it.c.ans) : judge(it.q, G.sel);
  G.answered = true;
  if(ok){ G.combo++; } else { G.combo = 0; if(G.mode === "sv") G.lives--; }
  if(it.kind === "calc"){
    S.calc.n++; if(ok) S.calc.c++;
    ensureDay(); S.act[todayStr()] = (S.act[todayStr()] || 0) + 1; S.day.n++;
    if(ok){ S.day.c++; S.day.combo++; S.day.maxCombo = Math.max(S.day.maxCombo, S.day.combo); } else S.day.combo = 0;
  } else recordAnswer(it.q, ok);
  let xp = ok ? (G.mode === "ta" ? 6 : it.kind === "calc" ? 12 : 10) + Math.min(G.combo, 5) * 2 : 3;
  if(ok && it.story) xp += 6;
  G.xp += xp; addXP(xp);
  if(ok){ G.coins += 1; addCoins(1); }
  S.best.combo = Math.max(S.best.combo, G.combo);
  if(G.mode === "case"){ G.genki = Math.max(0, Math.min(100, G.genki + (ok ? 25 : -10))); }
  G.res.push({ok, id: it.kind === "q" ? it.q.id : null, kind: it.kind, sec: it.sec || "", pts: it.story ? 2 : 1});
  save();
  feedback(ok);
  if(G.mode === "ta"){
    render();
    setTimeout(() => { if(G && G.mode === "ta" && G.answered) nextQ(); }, ok ? 380 : 900);
    return;
  }
  render();
  const nb = $("#next-btn"); if(nb){ nb.focus({preventScroll: true}); const ex = document.querySelector(".explain"); if(ex) ex.scrollIntoView({behavior: "smooth", block: "nearest"}); }
}
function nextQ(){
  if(!G || G.done) return;
  if((G.mode === "sv" && G.lives <= 0)){ finishGame(); return; }
  if(G.i + 1 >= G.items.length){
    if(G.mode === "ta" || G.mode === "sv"){ G.items = G.items.concat(shuffle(Q).map(qItem)); }
    else { finishGame(); return; }
  }
  G.i++; G.sel = []; G.answered = false; G.input = "";
  render(); window.scrollTo(0, 0);
}
function finishGame(){
  if(!G || G.done) return;
  G.done = true; clearInterval(G.timerId);
  const n = G.res.length, c = G.res.filter(r => r.ok).length;
  let title = "おつかれさま！", verdict = "", pass = null, detail = "";
  if(G.mode === "hitsu"){ pass = c >= 8; S.best.hitsu = Math.max(S.best.hitsu, c); verdict = pass ? "合格ライン突破！" : "あと" + (8 - c) + "問で合格ライン"; }
  if(G.mode === "ta"){ S.best.ta = Math.max(S.best.ta, c); verdict = c >= 15 ? "スピードスター！" : "60秒で" + c + "問正解"; }
  if(G.mode === "sv"){ S.best.sv = Math.max(S.best.sv, c); verdict = c + "問生きのこった！"; }
  if(G.mode === "calc"){ S.day.calc++; }
  if(G.mode === "case"){ S.day.cse++; S.cases[G.cs] = Math.max(S.cases[G.cs] || 0, c); pass = c === 3; verdict = pass ? "患者さん、すっかり元気に！" : "元気ゲージ " + G.genki + "%"; }
  if(G.mode === "mock"){
    const hc = G.res.filter(r => r.sec === "hitsu" && r.ok).length;
    const gp = G.res.filter(r => r.sec !== "hitsu" && r.ok).reduce((a, r) => a + r.pts, 0);
    const gmax = G.res.filter(r => r.sec !== "hitsu").reduce((a, r) => a + r.pts, 0) || 27;
    const gline = Math.ceil(gmax * PASS_GEN_RATE - 1e-9);
    pass = hc >= 8 && gp >= gline;
    S.best.mock = Math.max(S.best.mock, hc + gp); if(pass) S.best.mockPass = true;
    detail = `<div class="pass-line" style="margin-top:10px"><div>必修<br><b>${hc}</b>/10点<span class="sub">（ライン8点）</span> ${hc >= 8 ? "◎" : "×"}</div><div>一般＋状況<br><b>${gp}</b>/${gmax}点<span class="sub">（ライン${gline}点）</span> ${gp >= gline ? "◎" : "×"}</div></div>`;
    verdict = pass ? "合格ライン突破！" : "もう一歩！";
  }
  const rate = n ? c / n : 0;
  let bonus = 0;
  if(n >= 3 && (pass || (pass === null && rate >= .8))){ bonus = 20; addXP(20); addCoins(5); G.coins += 5; }
  G.xp += bonus;
  if(G.mode === "field"){ const fi = fieldInfo(G.field); detail = `<p class="small" style="text-align:center;margin-top:6px;font-weight:800">${esc(FMAP[G.field].n)}　${starsHTML(fi.stars, FMAP[G.field].col).replace('class="stars"', 'class="stars" style="display:inline-flex;vertical-align:middle"')}</p>`; }
  const ms = claimMissions(), bd = checkBadges();
  save(); checkBabyGrowth();
  const rk = rankOf(S.lv);
  const review = G.res.map((r, i) => {
    const it = G.items[i];
    const txt = it.kind === "calc" ? it.c.t + "：" + it.c.ans + " " + it.c.unit : it.q.q;
    return `<div class="review-item"><span class="mk" style="background:var(--${r.ok ? "ok" : "ng"})">${r.ok ? "○" : "×"}</span><span>${esc(txt.length > 60 ? txt.slice(0, 58) + "…" : txt)}</span></div>`;
  }).join("");
  const scoreLine = (G.mode === "ta" || G.mode === "sv") ? `${c}<small>問正解</small>` : `${c}<small>/${n}</small>`;
  openSheet(`<div class="lvup-pet" style="width:120px;height:120px">${piyoSVG(rk.st, rate >= .6 ? "happy" : "sad")}</div>
    <h2>${esc(title)}</h2><p class="sub small" style="text-align:center;font-weight:800">${esc(MODE_NAME[G.mode])}</p>
    <div class="bigscore num">${scoreLine}</div>
    ${verdict ? `<span class="verdict ${pass === false ? "fail" : "pass"}">${esc(verdict)}</span>` : ""}
    ${detail}
    <div class="gain"><span class="chip">XP +${G.xp}</span><span class="chip"><i class="c-coin">C</i>+${G.coins}</span>${bonus ? '<span class="chip">ボーナス込み</span>' : ""}</div>
    ${ms.length ? `<p class="small" style="text-align:center;margin-top:8px;font-weight:800;color:var(--ok)">ミッション達成：${ms.map(esc).join("・")}</p>` : ""}
    ${bd.length ? `<p class="small" style="text-align:center;margin-top:4px;font-weight:800;color:var(--grape)">バッジ獲得：${bd.map(esc).join("・")}</p>` : ""}
    ${n ? `<details style="margin-top:10px"><summary class="small" style="font-weight:800;cursor:pointer">解いた問題をふりかえる</summary><div class="review-list">${review}</div></details>` : ""}
    <div class="row" style="margin-top:14px"><button class="btn grow" data-act="close-result">ホームへ</button><button class="btn pink grow" data-act="again">もう一回</button></div>`, "result");
  if(rate >= .8 && n >= 3) confetti();
}
function quitGame(){
  if(!G) return;
  clearInterval(G.timerId);
  const hadAnswers = G.res.length > 0;
  if(hadAnswers && !G.done){ finishGame(); return; }
  G = null; closeSheet(); render();
}

/* ===== 勉強タイマー（開始時刻を保存するので、アプリを閉じても計測が続く） ===== */
const fmtMin = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}時間${r ? r + "分" : ""}` : `${r}分`; };
const fmtClock = ms => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return `${h}:${pad2(m)}:${pad2(s)}`; };
const studyOn = d => +S.study.days[d] || 0;
function studyWeek(){ let n = 0; for(let i = 0; i < 7; i++) n += studyOn(fmtD(addDays(new Date(), -i))); return n; }
function studyTotal(){ return Object.values(S.study.days).reduce((a, b) => a + (+b || 0), 0); }
function runningMs(){ return S.study.run ? Date.now() - S.study.run.s : 0; }
function setStudy(d, m){ m = Math.max(0, Math.min(1440, Math.round(m))); if(m) S.study.days[d] = m; else delete S.study.days[d]; }

function startStudy(){
  if(S.study.run) return;
  S.study.run = {s: Date.now()};
  ensureDay(); save(); render(); beep(SND.ok);
  toast("計測スタート！ アプリを閉じても計測は続きます");
  if(typeof Net !== "undefined") Net.publishNow();
}
function openStopSheet(){
  if(!S.study.run) return;
  const ms = runningMs(), min = Math.floor(ms / 60000), long = ms > 12 * 3600000;
  const sd = new Date(S.study.run.s);
  openSheet(`<h2>おつかれさま！</h2>
    <p class="bigscore num" style="font-size:2.4rem">${fmtClock(ms)}</p>
    <p class="note" style="text-align:center">${sd.getMonth() + 1}/${sd.getDate()} ${pad2(sd.getHours())}:${pad2(sd.getMinutes())} から計測</p>
    ${long ? '<p class="warn-note" style="margin-top:8px">12時間以上たっています。ストップを押し忘れていたら、下で実際に勉強した時間に直してから記録してください。</p>' : ""}
    <p class="note" style="margin-top:10px">記録する時間（変更できます）</p>
    <div class="form-grid"><label class="inp" for="stop-h">時間<input type="number" id="stop-h" min="0" max="24" inputmode="numeric" value="${Math.floor(min / 60)}"></label>
    <label class="inp" for="stop-m">分<input type="number" id="stop-m" min="0" max="59" inputmode="numeric" value="${min % 60}"></label></div>
    <div class="row" style="margin-top:14px"><button class="btn grow" data-act="close-sheet">計測をつづける</button><button class="btn pink grow" data-act="study-commit:${min}">記録する</button></div>
    <button class="btn sm ghost block" style="margin-top:10px" data-act="study-discard">記録せずにリセット</button>`, "study");
}
function readHM(hid, mid){
  const h = Math.max(0, Math.min(24, parseInt(($("#" + hid) || {}).value, 10) || 0));
  const m = Math.max(0, Math.min(59, parseInt(($("#" + mid) || {}).value, 10) || 0));
  return Math.min(1440, h * 60 + m);
}
function commitStudy(measured){
  if(!S.study.run) return;
  const min = readHM("stop-h", "stop-m"), start = S.study.run.s, dates = [];
  if(min === measured){
    /* 日をまたいだ場合は、実際の時刻で日ごとに分ける */
    let t = start, left = min;
    while(left > 0){
      const d = new Date(t), next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
      const part = Math.min(left, Math.max(1, Math.ceil((next - t) / 60000)));
      setStudy(fmtD(d), studyOn(fmtD(d)) + part); dates.push(fmtD(d));
      left -= part; t = next;
    }
  } else {
    const key = fmtD(new Date(start));
    setStudy(key, studyOn(key) + min); dates.push(key);
  }
  S.study.run = null;
  const xp = Math.min(min, 180);
  if(xp) addXP(xp);
  const bd = checkBadges();
  save(); closeSheet(); render();
  toast(min ? `${fmtMin(min)}を記録しました（+${xp}XP）` : "0分だったので記録しませんでした");
  if(bd.length) setTimeout(() => toast("バッジ獲得：" + bd.join("・")), 2700);
  if(typeof Net !== "undefined") Net.publishNow();
  checkBabyGrowth();
  if(!checkBirth(dates)) afterResult();
}
function discardStudy(){
  S.study.run = null; save(); closeSheet(); render(); toast("計測をリセットしました");
  if(typeof Net !== "undefined") Net.publishNow();
}

/* ===== ともだち・グループ =====
   公開の MQTT 中継所に「保持メッセージ」として自分の状態を置き、同じ番号の人がそれを読む。
   中身はグループ番号／友達番号から作った鍵（AES-GCM）で暗号化するので、番号を知らない人には読めない。 */
const IN_ARTIFACT = !!(window.claude && typeof window.claude.use === "function");
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
const TROOT = "piyonurse/v1/";
const APP_URL = /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname) ? location.origin + location.pathname : "https://daichi001100.github.io/piyo-nurse/";
const fmtCode = c => String(c).replace(/^(\d{4})(\d{4})$/, "$1 $2");
const cleanCode = v => String(v || "").replace(/[^\d]/g, "");
const FR_KEY = "piyonurse_fr_v1";
let FR = {g: {}, u: {}};
function loadFR(){
  FR = {g: {}, u: {}};
  if(!ACC.current) return;
  try{ const t = localStorage.getItem(FR_KEY + "_" + ACC.current); if(t){ const o = JSON.parse(t); if(o && o.g && o.u) FR = o; } }catch(e){}
}
loadFR();
let frSaveTimer = null;
function saveFR(){ const key = FR_KEY + "_" + ACC.current, data = JSON.stringify(FR); clearTimeout(frSaveTimer); frSaveTimer = setTimeout(() => { try{ if(ACC.current) localStorage.setItem(key, data); }catch(e){} }, 800); }

/* ---------- 暗号 ---------- */
const KEYS = {};
const enc = new TextEncoder();
async function keyFor(kind, code){
  const k = kind + ":" + code;
  if(KEYS[k]) return KEYS[k];
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: enc.encode("piyonurse/v1/" + kind), iterations: 100000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("piyonurse-topic/" + k)));
  const hex = Array.from(h.slice(0, 12), b => b.toString(16).padStart(2, "0")).join("");
  KEYS[k] = {key, topic: TROOT + kind + "/" + hex, kind, code};
  return KEYS[k];
}
function b64(u8){ let s = ""; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); }
function unb64(s){ const bin = atob(s), a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
async function seal(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
  return b64(out);
}
async function unseal(key, str){
  const buf = unb64(str);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, key, buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 自分の状態（見せる項目だけ） ---------- */
function myStatus(){
  const sh = S.social.share, st = {v: 1, id: S.social.id, name: S.social.name, ts: Date.now(), d: todayStr()};
  if(sh.now) st.run = S.study.run ? S.study.run.s : 0;
  if(sh.study){ const sd = {}; for(let i = 0; i < 7; i++){ const k = fmtD(addDays(new Date(), -i)); if(studyOn(k)) sd[k] = studyOn(k); } st.sd = sd; st.stot = studyTotal(); }
  if(sh.quiz) st.q = {n: S.tot.n, c: S.tot.c, dn: S.day.d === todayStr() ? S.day.n : 0, mock: S.best.mock, hitsu: S.best.hitsu};
  if(sh.grow){ st.lv = S.lv; st.st = rankOf(S.lv).st; st.ch = S.char; st.bb = S.babies.length; }
  if(sh.streak) st.sk = streakDays();
  if(sh.collect) st.stk = Object.keys(S.stk).length;
  return st;
}
function validStatus(o){ return o && typeof o === "object" && typeof o.id === "string" && typeof o.name === "string" && +o.ts > 0; }

/* ---------- 通信 ---------- */
function loadScript(src){ return new Promise((ok, ng) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); }); }
const Net = {
  started: false, clients: [], state: "off", tmap: {}, pubTimer: null, beat: null, lastSig: "", renderTimer: null,
  enabled(){ return !IN_ARTIFACT && !!ACC.current && !!S.social.on && !!S.social.name && !!window.WebSocket && !!(window.crypto && crypto.subtle); },
  stop(){
    clearInterval(this.beat); clearTimeout(this.pubTimer); clearTimeout(this.renderTimer);
    this.clients.forEach(c => { try{ c.end(true); }catch(e){} });
    this.clients = []; this.started = false; this.tmap = {}; this.lastSig = ""; this.setState("off");
  },
  setState(st){
    this.state = st;
    const label = {on: "つながっています", wait: "接続中…", err: "つながりません。電波の良い場所で開き直してください", off: "未接続"}[st];
    document.querySelectorAll("[data-net]").forEach(el => { el.textContent = label; el.dataset.state = st; });
  },
  refreshState(){ this.setState(this.clients.some(c => c.connected) ? "on" : (this.clients.length ? "wait" : "off")); },
  async start(){
    if(!this.enabled()) return;
    if(this.started){ this.sync(); return; }
    this.started = true; this.setState("wait");
    if(!window.mqtt){
      try{ await loadScript("https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"); }
      catch(e){ try{ await loadScript("https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"); }catch(e2){} }
    }
    if(!window.mqtt){ this.started = false; this.setState("err"); return; }
    await this.wanted();
    BROKERS.forEach(url => {
      let cl;
      try{ cl = mqtt.connect(url, {clientId: "pn_" + S.social.id + "_" + Math.random().toString(16).slice(2, 7), clean: true, connectTimeout: 9000, reconnectPeriod: 6000, keepalive: 50}); }catch(e){ return; }
      cl.subs = new Set();
      cl.on("connect", () => { cl.subs = new Set(); this.subscribeAll(cl); this.refreshState(); this.publishNow(true); S.social.groups.forEach(g => { if(g.name) this.publishMeta(g.code, g.name); }); });
      cl.on("message", (t, p) => this.onMessage(t, p));
      ["close", "offline", "error"].forEach(ev => cl.on(ev, () => this.refreshState()));
      this.clients.push(cl);
    });
    clearInterval(this.beat);
    this.beat = setInterval(() => { if(!document.hidden) this.publishNow(true); }, 4 * 60 * 1000);
  },
  async wanted(){
    const list = [];
    for(const g of S.social.groups){ const k = await keyFor("g", g.code); this.tmap[k.topic] = k; list.push(k.topic + "/#"); }
    for(const f of S.social.friends){ const k = await keyFor("u", f.code); this.tmap[k.topic] = k; list.push(k.topic); }
    const me = await keyFor("u", S.social.code); this.tmap[me.topic] = me;
    return list;
  },
  async subscribeAll(cl){
    const want = await this.wanted();
    want.forEach(t => { if(!cl.subs.has(t)){ cl.subscribe(t, {qos: 1}); cl.subs.add(t); } });
    [...cl.subs].forEach(t => { if(!want.includes(t)){ cl.unsubscribe(t); cl.subs.delete(t); } });
  },
  sync(){ this.clients.forEach(cl => { if(cl.connected) this.subscribeAll(cl); }); this.publishNow(true); },
  publishSoon(){ if(!this.started) return; clearTimeout(this.pubTimer); this.pubTimer = setTimeout(() => this.publishNow(false), 2500); },
  async publishNow(force){
    if(!this.started || !this.enabled()) return;
    const st = myStatus();
    const sig = JSON.stringify(Object.assign({}, st, {ts: 0})) + "|" + S.social.groups.map(g => g.code).join(",");
    if(!force && sig === this.lastSig) return;
    const live = this.clients.filter(c => c.connected);
    if(!live.length) return;
    this.lastSig = sig;
    try{
      const me = await keyFor("u", S.social.code);
      const msgs = [[me.topic, await seal(me.key, st)]];
      for(const g of S.social.groups){ const k = await keyFor("g", g.code); msgs.push([k.topic + "/m/" + S.social.id, await seal(k.key, st)]); }
      live.forEach(cl => msgs.forEach(([t, m]) => cl.publish(t, m, {qos: 1, retain: true})));
    }catch(e){}
  },
  async publishMeta(code, name){
    const k = await keyFor("g", code), m = await seal(k.key, {t: "meta", name, ts: Date.now()});
    this.clients.filter(c => c.connected).forEach(cl => cl.publish(k.topic + "/meta", m, {qos: 1, retain: true}));
  },
  async clearMember(code){
    const k = await keyFor("g", code);
    this.clients.filter(c => c.connected).forEach(cl => cl.publish(k.topic + "/m/" + S.social.id, "", {qos: 1, retain: true}));
  },
  async onMessage(topic, payload){
    const str = payload ? payload.toString() : "";
    let base = topic, sub = "";
    const m = /^(.*\/g\/[0-9a-f]+)\/(meta|m\/([A-Za-z0-9]+))$/.exec(topic);
    if(m){ base = m[1]; sub = m[2]; }
    const k = this.tmap[base];
    if(!k) return;
    if(k.kind === "g"){
      const g = FR.g[k.code] || (FR.g[k.code] = {meta: null, members: {}});
      if(sub === "meta"){
        if(!str) return;
        try{ const o = await unseal(k.key, str); if(o && o.t === "meta" && typeof o.name === "string" && (!g.meta || o.ts >= g.meta.ts)) g.meta = {name: o.name.slice(0, 20), ts: o.ts}; }catch(e){ return; }
      } else if(m && m[3]){
        const id = m[3];
        if(id === S.social.id) return;
        if(!str){ delete g.members[id]; }
        else { try{ const o = await unseal(k.key, str); if(validStatus(o) && o.id === id && (!g.members[id] || o.ts >= g.members[id].ts)) g.members[id] = o; }catch(e){ return; } }
      } else return;
    } else {
      if(!str || k.code === S.social.code) return;
      try{ const o = await unseal(k.key, str); if(validStatus(o) && (!FR.u[k.code] || o.ts >= FR.u[k.code].ts)) FR.u[k.code] = o; }catch(e){ return; }
    }
    saveFR(); this.softRender();
  },
  softRender(){
    clearTimeout(this.renderTimer);
    this.renderTimer = setTimeout(() => {
      if(G && !G.done) return;
      if($("#overlay")) return;
      const ae = document.activeElement;
      if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
      if(UI.tab === "friends" || UI.tab === "home"){ const y = window.scrollY; render(); window.scrollTo(0, y); }
    }, 700);
  }
};

/* ===== 1日10時間で赤ちゃん誕生（最大3人・前の誕生から7日以上あける） ===== */
const BIRTH_MIN = 600, BABY_MAX = 3, BABY_GAP = 7 * 86400000;
const BABY_SHORT = {piyo: "ぴよ", usa: "うさ", kuma: "くま"};
/* 成長ポイント＝誕生後の勉強時間（分）＋誕生後の正解数×2 */
const BABY_STAGES = [{p: 0, n: "あかちゃん"}, {p: 300, n: "よちよち"}, {p: 900, n: "ちびナース見習い"}, {p: 1800, n: "ちびナース"}, {p: 3600, n: "いちにんまえナース"}];
const babyPts = b => Math.max(0, studyTotal() - (+b.base.st || 0)) + Math.max(0, S.tot.c - (+b.base.c || 0)) * 2;
function babyStage(b){ const p = babyPts(b); let i = 0; BABY_STAGES.forEach((s, k) => { if(p >= s.p) i = k; }); return i; }
function nextBirthAt(){ const last = S.babies.reduce((m, b) => Math.max(m, +b.born || 0), 0); return last ? last + BABY_GAP : 0; }

function babySVG(sp, st, mood){
  sp = CHARS[sp] ? sp : "piyo";
  const L = 'stroke="var(--line)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
  const L3 = 'stroke="var(--line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  const col = sp === "usa" ? "var(--usa)" : sp === "kuma" ? "var(--kuma)" : "var(--piyo)";
  let s = `<svg viewBox="0 0 200 200" role="img" aria-label="${CHARS[sp].n}の赤ちゃん"><ellipse cx="100" cy="186" rx="44" ry="7" fill="var(--line)" opacity=".13"/><g class="piyo-bob">`;
  /* 耳 */
  if(sp === "usa") s += `<path d="M78 66c-10-18-10-40 0-42 9-1 12 22 10 40z" fill="${col}" ${L3}/><path d="M122 66c10-18 10-40 0-42-9-1-12 22-10 40z" fill="${col}" ${L3}/><path d="M80 58c-5-12-5-26 0-27 4 0 6 14 5 26z" fill="var(--usa-in)"/><path d="M120 58c5-12 5-26 0-27-4 0-6 14-5 26z" fill="var(--usa-in)"/>`;
  if(sp === "kuma") s += `<circle cx="66" cy="62" r="14" fill="${col}" ${L3}/><circle cx="134" cy="62" r="14" fill="${col}" ${L3}/><circle cx="66" cy="62" r="6" fill="var(--kuma-in)"/><circle cx="134" cy="62" r="6" fill="var(--kuma-in)"/>`;
  if(st === 0){
    /* おくるみ */
    s += `<path d="M54 118c0 38 20 62 46 62s46-24 46-62c-14 8-30 12-46 12s-32-4-46-12z" fill="var(--sky-s)" ${L}/><path d="M60 132c20 14 60 14 80 0" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="6 6"/>`;
  } else {

/* ---------- 明るい音楽（WebAudio） ---------- */
let partyBus = null;
function playParty(){
  if(!S.set.sound) return;
  unlockAudio(); if(!AC) return;
  try{
    if(AC.state === "suspended") AC.resume();
    stopParty();
    const bus = AC.createGain(); bus.gain.value = .9; bus.connect(AC.destination); partyBus = bus;
    const N = {C4: 262, D4: 294, E4: 330, F4: 349, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784, A5: 880, B5: 988, C6: 1047, D6: 1175, E6: 1319, C3: 131, F3: 175, G3: 196, A3: 220};
    const mel = "C5 E5 G5 C6 B5 G5 E5 G5 A5 F5 A5 C6 G5 - - - E5 G5 C6 E6 D6 C6 B5 G5 A5 B5 C6 D6 C6 - G5 -".split(" ");
    const bass = ["C3", "G3", "F3", "G3", "C3", "G3", "F3", "C3"];
    const step = .17, t0 = AC.currentTime + .05;
    const note = (f, t, d, type, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(bus); o.start(t); o.stop(t + d + .03);
    };
    for(let r = 0; r < 2; r++){
      const base = t0 + r * mel.length * step;
      mel.forEach((n, i) => { if(N[n]) note(N[n], base + i * step, step * 1.6, "square", .07); });
      bass.forEach((n, i) => { note(N[n], base + i * 4 * step, step * 3.6, "triangle", .14); note(N[n] * 2, base + (i * 4 + 2) * step, step * 1.2, "triangle", .06); });
      for(let i = 0; i < mel.length; i += 2) note(2200, base + i * step, .04, "square", .02);
    }
  }catch(e){}
}
function stopParty(){ if(partyBus){ try{ partyBus.gain.setTargetAtTime(.0001, AC.currentTime, .08); const b = partyBus; setTimeout(() => { try{ b.disconnect(); }catch(e){} }, 400); }catch(e){} partyBus = null; } }

let AC = null;
function unlockAudio(){
  if(AC || !S.set.sound) return;
  try{ const C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); }catch(e){ AC = null; }
}
function beep(notes){
  if(!S.set.sound) return;
  unlockAudio(); if(!AC) return;
  try{
    if(AC.state === "suspended") AC.resume();
    let t = AC.currentTime;
    notes.forEach(([f, d, type]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .8;
    });
  }catch(e){}
}
const SND = {ok: [[880, .09], [1320, .16]], ng: [[220, .18, "square"], [180, .22, "square"]], lv: [[523, .1], [659, .1], [784, .1], [1047, .28]], gacha: [[660, .08], [880, .08], [1100, .08], [1320, .25]]};

/* ---------- 操作 ---------- */
function onAct(act, el){
  const [a, b, c] = act.split(":");
  if(a === "tab"){ UI.tab = b; saveUI(); render(); window.scrollTo(0, 0); return; }
  if(a === "start"){ closeSheet(); startGame(b, c); return; }
  if(a === "party-close"){ closeParty(); return; }
  if(a === "party-name"){ nameBaby(); return; }
  if(a === "study-start"){ startStudy(); return; }
  if(a === "study-stop"){ openStopSheet(); return; }
  if(a === "study-commit"){ commitStudy(+b); return; }
  if(a === "study-discard"){ discardStudy(); return; }
  if(a === "study-edit"){ openStudyEditor(b || todayStr()); return; }
  if(a === "study-add" || a === "study-set"){ saveStudyEdit(a === "study-add" ? "add" : "set"); return; }
  if((a.startsWith("soc-") || a === "copy") && socAct(a, b, c)) return;
  if((a.startsWith("ob-") || a.startsWith("acc")) && accAct(a, b)) return;
  if(a === "rv"){ UI.rv = b; saveUI(); render(); return; }
  if(a === "choose"){ choose(+b); return; }
  if(a === "submit"){ if(G && G.sel.length === 2) answer(); return; }
  if(a === "next"){ nextQ(); return; }
  if(a === "key"){ if(G && !G.answered && G.input.length < 5){ G.input = (G.input === "0" ? "" : G.input) + b; render(); } return; }
  if(a === "key-del"){ if(G && !G.answered){ G.input = G.input.slice(0, -1); render(); } return; }
  if(a === "key-ok"){ if(G && !G.answered && G.input) answer(); return; }
  if(a === "quit-ask"){
    if(!G) return;
    if(!G.res.length){ quitGame(); return; }
    openSheet(`<h2>ここでやめる？</h2><p class="small" style="text-align:center;margin-top:6px;font-weight:700">ここまでに答えた${G.res.length}問の記録は保存されます。</p><div class="row" style="margin-top:14px"><button class="btn grow" data-act="close-sheet">つづける</button><button class="btn pink grow" data-act="quit-yes">やめて結果を見る</button></div>`, "quit");
    return;
  }
  if(a === "quit-yes"){ closeSheet(); quitGame(); return; }
  if(a === "close-sheet"){
    const k = sheetKind; closeSheet();
    if(k === "result" || k === "lv"){ if(!afterResult() && G && G.done){ G = null; render(); } }
    return;
  }
  if(a === "close-result" || a === "again"){
    const again = a === "again" && G ? [G.mode, G.mode === "field" ? G.field : G.mode === "case" ? "" : G.arg] : null;
    closeSheet(); G = null; render();
    if(afterResult()){ pendingAgain = again; return; }
    if(again) startGame(again[0], again[1]);
    return;
  }
  if(a === "poke"){ const p = $("#pet svg"); if(p){ p.classList.remove("piyo-jump"); void p.getBoundingClientRect(); p.classList.add("piyo-jump"); } beep([[1200, .06], [1500, .08]]); return; }
  if(a === "gacha" || a === "gacha-again"){ closeSheet(); if(UI.tab !== "zukan"){ UI.tab = "zukan"; render(); } doGacha(); return; }
  if(a === "sound"){ S.set.sound = !S.set.sound; save(); render(); if(S.set.sound) beep(SND.ok); return; }
  if(a === "reset-ask"){ const bx = $("#reset-box"); if(bx) bx.innerHTML = `<p class="small" style="font-weight:800;color:var(--ng)">レベル・コイン・シール・解答記録がすべて消えます。元に戻せません。</p><div class="row" style="margin-top:8px"><button class="btn sm" data-act="reset-no">やめる</button><button class="btn sm pink" data-act="reset-yes">すべて消す</button></div>`; return; }
  if(a === "reset-no"){ render(); return; }
  if(a === "reset-yes"){ const keepExam = S.set.exam, keepSoc = S.social, keepChar = S.char; S = defaultState(); S.set.exam = keepExam; S.social = keepSoc; S.char = keepChar; save(); render(); toast("記録をリセットしました（友達のつながりは残しています）"); return; }
}
let pendingAgain = null;

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const act = el.getAttribute("data-act");
  if(act === "close-sheet" && pendingAgain && (sheetKind === "lv")){ const pa = pendingAgain; pendingAgain = null; closeSheet(); startGame(pa[0], pa[1]); return; }
  onAct(act, el);
});
document.addEventListener("change", e => {
  if(e.target && e.target.id === "study-date"){ if(parseD(e.target.value)) openStudyEditor(e.target.value); return; }
  if(e.target && e.target.id === "exam-date"){
    if(parseD(e.target.value)){ S.set.exam = e.target.value; save(); render(); toast("試験日を変更しました"); }
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target && e.target.id === "baby-name" && !e.isComposing){ nameBaby(); e.preventDefault(); return; }
  if(e.key === "Enter" && e.target && e.target.id === "nick"){ socAct("soc-rename-do"); e.preventDefault(); return; }
  if(e.key === "Enter" && e.target && e.target.id === "ob-name" && !e.isComposing){ createAccount(); e.preventDefault(); return; }
  if(!G || G.done || $("#overlay")) return;
  if(e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const it = curItem();
  if(it.kind === "q" && !G.answered && e.key === "Enter" && isMulti(it.q) && G.sel.length === 2){ answer(); e.preventDefault(); }
  else if(it.kind === "q" && !G.answered && /^[1-5]$/.test(e.key)){ const i = +e.key - 1; if(i < it.q.c.length){ choose(i); e.preventDefault(); } }
  else if(it.kind === "calc" && !G.answered){
    if(/^[0-9]$/.test(e.key)){ onAct("key:" + e.key); e.preventDefault(); }
    else if(e.key === "Backspace"){ onAct("key-del"); e.preventDefault(); }
    else if(e.key === "Enter"){ onAct("key-ok"); e.preventDefault(); }
  }
  else if(e.key === "Enter" && G.answered && G.mode !== "ta" && document.activeElement && document.activeElement.id !== "next-btn"){ nextQ(); e.preventDefault(); }
});

/* ---------- 起動（公開ページの更新時は途中のゲームを引き継ぐ） ---------- */
function snapshotG(){
  if(!G || G.done) return null;
  return {mode: G.mode, arg: G.arg, field: G.field, cs: G.cs, genki: G.genki, i: G.i, lives: G.lives, time: G.time, combo: G.combo, xp: G.xp, coins: G.coins, res: G.res,
    items: G.items.map(it => it.kind === "calc" ? {kind: "calc", c: it.c} : {kind: "q", id: it.q.id, story: it.story ? it.story.id : null, sec: it.sec || "", ord: it.ord})};
}
function restoreG(d){
  if(!d || !Array.isArray(d.items)) return;
  const items = d.items.map(it => it.kind === "calc" ? it : (QMAP[it.id] ? {kind: "q", q: QMAP[it.id], story: it.story ? CASES.find(c => c.id === it.story) : null, sec: it.sec, ord: Array.isArray(it.ord) && it.ord.length === QMAP[it.id].c.length ? it.ord : makeOrd(QMAP[it.id])} : null)).filter(Boolean);
  if(!items.length) return;
  G = {mode: d.mode, arg: d.arg, field: d.field, cs: d.cs, genki: d.genki, items, i: Math.min(d.i || 0, items.length - 1), sel: [], done: false, answered: false, res: d.res || [], combo: d.combo || 0, xp: d.xp || 0, coins: d.coins || 0, input: "", lives: d.lives == null ? 3 : d.lives, time: d.time || 60};
  if(G.mode === "ta") startTimer();
}
function start(data){
  ensureDay();
  if(data && data.ui) Object.assign(UI, data.ui);
  if(data && data.g) restoreG(data.g);
  render();
  Sync.boot().then(changed => { if(changed){ loadFR(); render(); Net.stop(); Net.start(); } Sync.init(); });
  Net.start();
}
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = fmtClock(now - +el.dataset.since); });
}, 1000);
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  ensureDay();
  if(!G && !$("#overlay")) render();
  Net.publishNow(true);
});
try{ window.claude?.hot?.snapshot?.(() => ({ui: UI, g: snapshotG()})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});

</script>
